<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da Um Play IA — Streaming VIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#07080c] text-white font-sans antialiased selection:bg-[#ff1722] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_SERIES = [
      {
        id: 's1',
        title: 'Cyber Amazônia 2099',
        category: 'Ficção Científica IA',
        synopsis: 'Em um futuro dominado por megacorporações sintéticas, uma guerreira biomecânica descobre o código-fonte ancestral oculto no coração da floresta.',
        poster: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: true,
        episodes: [
          {
            id: 'e1',
            number: 1,
            title: 'O Despertar da Máquina (Episódio Grátis)',
            duration: '14 min',
            isVip: false,
            thumb: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
          },
          {
            id: 'e2',
            number: 2,
            title: 'Protocolo Vermelho na Neo-Manaus',
            duration: '18 min',
            isVip: true,
            thumb: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'
          },
          {
            id: 'e3',
            number: 3,
            title: 'A Batalha dos Drones Neurais',
            duration: '21 min',
            isVip: true,
            thumb: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
          }
        ]
      },
      {
        id: 's2',
        title: 'Crônicas do Submundo Neon',
        category: 'Ação & Suspense IA',
        synopsis: 'Caçadores de recompensas digitais disputam o controle das memórias proibidas da metrópole.',
        poster: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: false,
        episodes: [
          {
            id: 'e201',
            number: 1,
            title: 'Noite de Caçada (Episódio Piloto)',
            duration: '12 min',
            isVip: false,
            thumb: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
          },
          {
            id: 'e202',
            number: 2,
            title: 'Infiltração na Torre Azul',
            duration: '19 min',
            isVip: true,
            thumb: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
          }
        ]
      }
    ];

    const DEFAULT_USERS = [
      {
        id: 'u_demo_1',
        name: 'Lucas Mendes',
        email: 'lucas@gmail.com',
        whatsapp: '11999990000',
        password: '123',
        isVip: true,
        paymentStatus: 'approved', // 'none' | 'pending' | 'approved'
        isOnline: false,
        lastEntry: '31/10, 10:15',
        lastExit: '31/10, 11:40',
        lastWatched: 'Ep. 3 - A Batalha dos Drones Neurais'
      }
    ];

    const nowFormatted = () => {
      const d = new Date();
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' +
             d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    };

    function App() {
      // Catálogo e Usuários com salvamento permanente
      const [seriesList, setSeriesList] = useState(() => {
        const saved = localStorage.getItem('dup_series_v2');
        return saved ? JSON.parse(saved) : DEFAULT_SERIES;
      });

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('dup_users_v2');
        return saved ? JSON.parse(saved) : DEFAULT_USERS;
      });

      // Usuário logado atualmente (null = deslogado/visitante)
      const [currentUserId, setCurrentUserId] = useState(() => {
        return localStorage.getItem('dup_logged_user_v2') || null;
      });

      const [selectedSeriesId, setSelectedSeriesId] = useState('s1');
      const [activeEpisode, setActiveEpisode] = useState(null);

      // Modais de Autenticação do Cliente (Login / Cadastro)
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regWhatsapp, setRegWhatsapp] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [userAuthError, setUserAuthError] = useState('');

      // Modal de Pagamento PIX Blindado (NÃO libera sozinho sem confirmação!)
      const [showVipModal, setShowVipModal] = useState(false);
      const [pixCopied, setPixCopied] = useState(false);
      const [pixCheckMsg, setPixCheckMsg] = useState('');
      const [pixKeyConfig, setPixKeyConfig] = useState(() => {
        return localStorage.getItem('dup_pix_key_v2') || '00020126580014BR.GOV.BCB.PIX0136daumplayia-pix-99052040000530398654049.905802BR';
      });

      // Segurança do Painel ADM (Oculto e Criptografado Base64)
      const [logoClicks, setLogoClicks] = useState(0);
      const [showAdminAuthModal, setShowAdminAuthModal] = useState(false);
      const [adminUnlocked, setAdminUnlocked] = useState(false);
      const [adminTab, setAdminTab] = useState('usuarios');
      const [adminStoredSecret, setAdminStoredSecret] = useState(() => {
        return localStorage.getItem('dup_adm_sec_v2') || 'YWRtaW4xMjM='; // btoa('admin123')
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Formulário ADM: Criar Nova Série / Lançamento
      const [newSerieTitle, setNewSerieTitle] = useState('');
      const [newSerieCategory, setNewSerieCategory] = useState('Série Original IA');
      const [newSerieSynopsis, setNewSerieSynopsis] = useState('');
      const [newSeriePoster, setNewSeriePoster] = useState('');
      const [newSerieBanner, setNewSerieBanner] = useState('');
      const [newSerieIsHero, setNewSerieIsHero] = useState(false);

      // Formulário ADM: Subir Novo Episódio
      const [newEpSeriesId, setNewEpSeriesId] = useState('s1');
      const [newEpTitle, setNewEpTitle] = useState('');
      const [newEpNumber, setNewEpNumber] = useState(1);
      const [newEpDuration, setNewEpDuration] = useState('15 min');
      const [newEpThumb, setNewEpThumb] = useState('');
      const [newEpVideo, setNewEpVideo] = useState('');
      const [newEpIsVip, setNewEpIsVip] = useState(true);

      // Troca de Senha do ADM
      const [currentPassCheck, setCurrentPassCheck] = useState('');
      const [newAdminPass, setNewAdminPass] = useState('');
      const [passChangeMsg, setPassChangeMsg] = useState('');

      // Persistir alterações automaticamente
      useEffect(() => {
        localStorage.setItem('dup_series_v2', JSON.stringify(seriesList));
      }, [seriesList]);

      useEffect(() => {
        localStorage.setItem('dup_users_v2', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        if (currentUserId) {
          localStorage.setItem('dup_logged_user_v2', currentUserId);
        } else {
          localStorage.removeItem('dup_logged_user_v2');
        }
      }, [currentUserId]);

      // Gatilho Secreto: 3 cliques na Logo
      useEffect(() => {
        if (logoClicks === 0) return;
        if (logoClicks >= 3) {
          setShowAdminAuthModal(true);
          setLogoClicks(0);
          return;
        }
        const timer = setTimeout(() => setLogoClicks(0), 1200);
        return () => clearTimeout(timer);
      }, [logoClicks]);

      const currentUser = users.find((u) => u.id === currentUserId) || null;
      const heroSeries = seriesList.find((s) => s.isHeroLaunch) || seriesList[0];
      const selectedSeries = seriesList.find((s) => s.id === selectedSeriesId) || seriesList[0];

      // ===================================================================
      // 1. CADASTRO, LOGIN E SAÍDA (LOGOUT) DO USUÁRIO COM REGISTRO DE HORÁRIO
      // ===================================================================
      const handleUserRegister = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const emailClean = regEmail.trim().toLowerCase();
        if (!regName.trim() || !emailClean || !regPassword.trim()) {
          setUserAuthError('Preencha todos os campos obrigatórios.');
          return;
        }
        if (users.some((u) => u.email.toLowerCase() === emailClean)) {
          setUserAuthError('Este e-mail já está cadastrado. Faça login.');
          return;
        }

        const newUser = {
          id: 'u_' + Date.now(),
          name: regName.trim(),
          email: emailClean,
          whatsapp: regWhatsapp.trim() || 'Não informado',
          password: regPassword,
          isVip: false, // SEMPRE COMEÇA GRÁTIS (100% SEGURO)
          paymentStatus: 'none',
          isOnline: true,
          lastEntry: nowFormatted(),
          lastExit: 'Online agora',
          lastWatched: 'Acabou de criar a conta'
        };

        setUsers((prev) => [newUser, ...prev]);
        setCurrentUserId(newUser.id);
        setShowAuthModal(false);
        setRegName('');
        setRegEmail('');
        setRegWhatsapp('');
        setRegPassword('');
      };

      const handleUserLogin = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const emailClean = regEmail.trim().toLowerCase();
        const found = users.find(
          (u) => u.email.toLowerCase() === emailClean && u.password === regPassword
        );

        if (!found) {
          setUserAuthError('E-mail ou senha incorretos.');
          return;
        }

        setUsers((prev) =>
          prev.map((u) =>
            u.id === found.id
              ? { ...u, isOnline: true, lastEntry: nowFormatted(), lastExit: 'Online agora' }
              : u
          )
        );
        setCurrentUserId(found.id);
        setShowAuthModal(false);
        setRegEmail('');
        setRegPassword('');
      };

      const handleUserLogout = () => {
        if (!currentUser) return;
        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id
              ? { ...u, isOnline: false, lastExit: nowFormatted() }
              : u
          )
        );
        setCurrentUserId(null);
        setActiveEpisode(null);
      };

      // ===================================================================
      // 2. TRAVA REAL DE VÍDEO (OBRIGA LOGIN E VALIDA VIP DE VERDADE)
      // ===================================================================
      const handlePlayEpisode = (episode) => {
        // Se não estiver logado, abre a tela de Cadastro/Login primeiro
        if (!currentUser) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        // Se o episódio é VIP e o usuário NÃO é VIP, bloqueia e pede PIX
        if (episode.isVip && !currentUser.isVip) {
          setPixCheckMsg('');
          setShowVipModal(true);
          return;
        }

        // Liberado: abre o player e registra no painel do ADM qual episódio ele está vendo
        setActiveEpisode(episode);
        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id
              ? { ...u, lastWatched: `Ep. ${episode.number} - ${episode.title}` }
              : u
          )
        );
      };

      // ===================================================================
      // 3. PAGAMENTO PIX SEGURO (NÃO LIBERA VIP DE GRAÇA!)
      // ===================================================================
      const handleNotifyPixPayment = () => {
        if (!currentUser) {
          setShowVipModal(false);
          setShowAuthModal(true);
          return;
        }

        // Marca o usuário como "Aguardando Confirmação de PIX" no Painel ADM
        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id ? { ...u, paymentStatus: 'pending' } : u
          )
        );

        setPixCheckMsg(
          '⏳ Solicitação enviada! Seu pagamento PIX de R$ 9,90 está sendo verificado pelo banco. Assim que compensar, seu acesso VIP será liberado.'
        );
      };

      // ===================================================================
      // 4. FUNÇÕES EXCLUSIVAS DO DONO (ADM)
      // ===================================================================
      const toggleUserVipByAdmin = (userId) => {
        setUsers((prev) =>
          prev.map((u) => {
            if (u.id !== userId) return u;
            const nextVip = !u.isVip;
            return {
              ...u,
              isVip: nextVip,
              paymentStatus: nextVip ? 'approved' : 'none'
            };
          })
        );
      };

      const forceDisconnectUser = (userId) => {
        setUsers((prev) =>
          prev.map((u) =>
            u.id === userId ? { ...u, isOnline: false, lastExit: nowFormatted() + ' (Derrubado pelo ADM)' } : u
          )
        );
        if (currentUserId === userId) {
          setCurrentUserId(null);
        }
      };

      const deleteUserByAdmin = (userId) => {
        setUsers((prev) => prev.filter((u) => u.id !== userId));
        if (currentUserId === userId) setCurrentUserId(null);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (btoa(passwordInput) === adminStoredSecret) {
          setAdminUnlocked(true);
          setShowAdminAuthModal(false);
          setPasswordInput('');
          setAuthError('');
        } else {
          setAuthError('Acesso Negado: Senha de Administrador incorreta.');
        }
      };

      const handleCreateSeries = (e) => {
        e.preventDefault();
        if (!newSerieTitle.trim()) return;
        const created = {
          id: 's_' + Date.now(),
          title: newSerieTitle.trim(),
          category: newSerieCategory.trim() || 'Série IA',
          synopsis: newSerieSynopsis.trim() || 'Nova série exclusiva produzida com Inteligência Artificial.',
          poster: newSeriePoster.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
          banner: newSerieBanner.trim() || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
          isHeroLaunch: newSerieIsHero,
          episodes: []
        };

        setSeriesList((prev) => {
          const base = newSerieIsHero ? prev.map((s) => ({ ...s, isHeroLaunch: false })) : prev;
          return [created, ...base];
        });
        setSelectedSeriesId(created.id);
        setNewEpSeriesId(created.id);
        setNewSerieTitle('');
        setNewSerieSynopsis('');
        setNewSeriePoster('');
        setNewSerieBanner('');
        setNewSerieIsHero(false);
      };

      const handleAddEpisode = (e) => {
        e.preventDefault();
        if (!newEpTitle.trim()) return;
        const newEp = {
          id: 'ep_' + Date.now(),
          number: Number(newEpNumber),
          title: newEpTitle.trim(),
          duration: newEpDuration || '15 min',
          isVip: newEpIsVip,
          thumb: newEpThumb.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
          videoUrl: newEpVideo.trim() || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
        };

        setSeriesList((prev) =>
          prev.map((s) =>
            s.id === newEpSeriesId ? { ...s, episodes: [...s.episodes, newEp] } : s
          )
        );
        setNewEpTitle('');
        setNewEpNumber((n) => Number(n) + 1);
      };

      const handleDeleteEpisode = (serieId, epId) => {
        setSeriesList((prev) =>
          prev.map((s) =>
            s.id === serieId
              ? { ...s, episodes: s.episodes.filter((ep) => ep.id !== epId) }
              : s
          )
        );
      };

      const pendingPixCount = users.filter((u) => u.paymentStatus === 'pending' && !u.isVip).length;

      return (
        <div className="min-h-screen bg-[#07080c] text-white">
          {/* ===============================================================
              BARRA DO TOPO (COM CADASTRO, LOGIN, CONTA E SAÍDA REAL)
          =============================================================== */}
          <header className="sticky top-0 z-40 bg-[#07080c]/95 backdrop-blur-md border-b border-white/10 px-4 md:px-8 py-4 flex items-center justify-between gap-3">
            <div className="flex items-center gap-6">
              <button
                onClick={() => setLogoClicks((c) => c + 1)}
                className="flex items-center gap-2.5 text-left focus:outline-none select-none"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#ff1722] to-[#00d4ff] p-0.5 shadow-lg shadow-[#ff1722]/20">
                  <div className="w-full h-full bg-[#07080c] rounded-[10px] flex items-center justify-center font-black text-[#ff1722]">
                    ▶
                  </div>
                </div>
                <div>
                  <span className="text-lg md:text-xl font-black tracking-tighter text-white">
                    DA UM <span className="text-[#ff1722]">PLAY</span>{' '}
                    <span className="text-[#00d4ff]">IA</span>
                  </span>
                  <span className="block text-[10px] uppercase tracking-widest text-gray-400">
                    Streaming VIP Original
                  </span>
                </div>
              </button>

              <nav className="hidden lg:flex items-center gap-6 text-sm font-semibold text-gray-300">
                <a href="#vitrine" className="hover:text-white transition">Início</a>
                <a href="#catalogo" className="hover:text-white transition">Séries & Lançamentos</a>
              </nav>
            </div>

            {/* Área de Conta do Usuário (Entrar / Cadastrar / Status VIP / Sair) */}
            <div className="flex items-center gap-2.5">
              {!currentUser ? (
                <>
                  <button
                    onClick={() => {
                      setAuthMode('login');
                      setUserAuthError('');
                      setShowAuthModal(true);
                    }}
                    className="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/15 text-white transition"
                  >
                    Entrar
                  </button>
                  <button
                    onClick={() => {
                      setAuthMode('register');
                      setUserAuthError('');
                      setShowAuthModal(true);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#ff1722] hover:bg-[#ff1722]/90 text-white shadow-lg shadow-[#ff1722]/30 transition"
                  >
                    Criar Conta
                  </button>
                </>
              ) : (
                <div className="flex items-center gap-2.5">
                  {currentUser.isVip ? (
                    <span className="px-3 py-1.5 rounded-full text-[11px] font-black bg-[#00d4ff]/20 text-[#00d4ff] border border-[#00d4ff]/50">
                      👑 VIP ATIVO
                    </span>
                  ) : currentUser.paymentStatus === 'pending' ? (
                    <button
                      onClick={() => setShowVipModal(true)}
                      className="px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40"
                    >
                      ⏳ PIX em Análise
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        setPixCheckMsg('');
                        setShowVipModal(true);
                      }}
                      className="px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-[#ff1722] to-[#00d4ff] text-white shadow-lg"
                    >
                      👑 Virar VIP • R$ 9,90
                    </button>
                  )}

                  <div className="hidden sm:block text-right text-xs">
                    <div className="font-bold text-white leading-tight">{currentUser.name}</div>
                    <div className="text-[10px] text-gray-400">
                      {currentUser.isVip ? 'Assinante Premium' : 'Plano Grátis'}
                    </div>
                  </div>

                  <button
                    onClick={handleUserLogout}
                    className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-[#ff1722] text-xs font-bold text-gray-200 hover:text-white transition"
                    title="Sair da Conta"
                  >
                    Sair
                  </button>
                </div>
              )}

              {adminUnlocked && (
                <button
                  onClick={() => setAdminUnlocked(false)}
                  className="px-3 py-1.5 rounded-lg bg-[#ff1722]/20 border border-[#ff1722] text-[#ff1722] text-xs font-bold"
                >
                  Fechar ADM
                </button>
              )}
            </div>
          </header>

          {/* ===============================================================
              PAINEL DO ADM (OCULTO POR SENHA)
          =============================================================== */}
          {adminUnlocked && (
            <section className="bg-[#0d1017] border-b-2 border-[#00d4ff] p-6 shadow-2xl">
              <div className="max-w-6xl mx-auto space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-white/10">
                  <div>
                    <h2 className="text-lg font-black uppercase text-[#00d4ff] flex items-center gap-2">
                      🛡️ Painel de Controle do Administrador
                      {pendingPixCount > 0 && (
                        <span className="px-2.5 py-0.5 rounded-full text-xs bg-amber-500 text-black font-black animate-pulse">
                          {pendingPixCount} PIX aguardando sua aprovação!
                        </span>
                      )}
                    </h2>
                    <p className="text-xs text-gray-400">
                      Monitore quem cadastrou, quem entrou, quem saiu, aprove pagamentos PIX de R$ 9,90 e suba séries/episódios.
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() => setAdminTab('usuarios')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'usuarios' ? 'bg-[#ff1722] text-white' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      1. Usuários & Dar/Tirar VIP ({users.length})
                    </button>
                    <button
                      onClick={() => setAdminTab('lancamentos')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'lancamentos' ? 'bg-[#ff1722] text-white' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      2. Subir Séries, Capas & Episódios
                    </button>
                    <button
                      onClick={() => setAdminTab('pix')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'pix' ? 'bg-[#00d4ff] text-[#07080c]' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      3. Configurar PIX R$ 9,90 & Senha ADM
                    </button>
                  </div>
                </div>

                {/* ABA 1: CONTROLE DE USUÁRIOS, ENTRADA, SAÍDA E PODER DE DAR/TIRAR VIP */}

          =============================================================== */}
          {showVipModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border-2 border-[#00d4ff] rounded-3xl max-w-md w-full p-6 space-y-5 relative">
                <button
                  onClick={() => setShowVipModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="text-center space-y-1">
                  <div className="text-3xl">👑</div>
                  <h3 className="text-2xl font-black">Assinatura VIP Mensal</h3>
                  <p className="text-xs text-gray-300">
                    Episódio exclusivo para assinantes VIP. Desbloqueie todo o catálogo por 30 dias.
                  </p>
                </div>

                <div className="bg-[#07080c] border border-white/10 rounded-2xl p-4 text-center">
                  <span className="text-xs text-gray-400 uppercase">Valor Único Mensal</span>
                  <div className="text-4xl font-black text-[#00d4ff] my-1">R$ 9,90</div>
                  <span className="text-[11px] text-gray-400">
                    Copie a chave PIX abaixo e realize o pagamento no seu banco
                  </span>
                </div>

                <div className="space-y-2.5">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(pixKeyConfig);
                      setPixCopied(true);
                      setTimeout(() => setPixCopied(false), 3000);
                    }}
                    className="w-full py-3 rounded-xl bg-[#00d4ff] text-[#07080c] text-xs font-black uppercase"
                  >
                    {pixCopied ? '✅ Código PIX Copiado!' : '📋 1. Copiar Código PIX (R$ 9,90)'}
                  </button>

                  <button
                    onClick={handleNotifyPixPayment}
                    className="w-full py-3 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold text-xs uppercase"
                  >
                    2. Já realizei o PIX (Solicitar Liberação)
                  </button>
                </div>

                {pixCheckMsg && (
                  <div className="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs text-center font-semibold">
                    {pixCheckMsg}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ===============================================================
              PLAYER DE VÍDEO (SÓ ABRE SE PASSAR PELA TRAVA DE SEGURANÇA)
          =============================================================== */}
          {activeEpisode && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border border-white/15 rounded-3xl max-w-4xl w-full overflow-hidden">
                <div className="p-4 border-b border-white/10 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-[#ff1722]">
                      EPISÓDIO {activeEpisode.number}
                    </span>
                    <h3 className="text-base font-black">{activeEpisode.title}</h3>
                  </div>
                  <button
                    onClick={() => setActiveEpisode(null)}
                    className="px-3 py-1 rounded-lg bg-white/10 text-sm font-bold"
                  >
                    ✕ Fechar
                  </button>
                </div>
                <div className="aspect-video bg-black">
                  <video src={activeEpisode.videoUrl} controls autoPlay className="w-full h-full" />
                </div>
              </div>
            </div>
          )}

          {/* MODAL SECRETO DO ADM */}
          {showAdminAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <form
                onSubmit={handleAdminLogin}
                className="bg-[#0d1017] border border-white/15 rounded-2xl max-w-sm w-full p-6 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black uppercase">🔒 Acesso do Administrador</h3>
                  <button
                    type="button"
                    onClick={() => {
                      setShowAdminAuthModal(false);
                      setAuthError('');
                      setPasswordInput('');
                    }}
                    className="text-gray-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
                <input
                  type="password"
                  required
                  autoFocus
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  placeholder="Senha do Administrador"
                  className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-sm text-white"
                />
                {authError && <p className="text-xs text-[#ff1722] font-semibold">{authError}</p>}
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-[#ff1722] text-white font-black text-xs uppercase"
                >
                  Desbloquear Painel
                </button>
              </form>
            </div>
          )}

          <footer className="border-t border-white/10 py-8 px-6 text-center text-xs text-gray-500 flex items-center justify-center gap-2">
            <span>© 2026 Da Um Play IA — Todos os direitos reservados.</span>
            <button
              onClick={() => setShowAdminAuthModal(true)}
              className="opacity-20 hover:opacity-60 transition p-1"
              aria-label="Configurações"
            >
              🔒
            </button>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
