  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      background-color: #07080c;
      scroll-behavior: smooth;
    }
    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #07080c; }
    ::-webkit-scrollbar-thumb { background: #1f2433; border-radius: 9999px; }

</head>
<body class="bg-[#07080c] text-white font-sans antialiased selection:bg-[#ff1722] selection:text-white pb-16 md:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // CONFIGURAÇÃO GLOBAL DE FÁBRICA (OPCIONAL: COLE AQUI PARA TODOS OS CELULARES)
    // =========================================================================
    const FIXED_SUPABASE_URL = ''; // Ex: 'https://seuprojeto.supabase.co'
    const FIXED_SUPABASE_KEY = ''; // Ex: 'sb_publishable_...'

    // Bloqueio global contra inspeção de código (F12 / Ctrl+U / Botão Direito)
    window.addEventListener('contextmenu', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    });
    window.addEventListener('keydown', (e) => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
      }
    });

    const DEFAULT_SERIES = [
      {
        id: 's1',
        title: 'A Herdeira de Ferro IA',
        category: 'Mini Novelinha IA',
        synopsis: 'Humilhada pela família bilionária, ela retorna cinco anos depois com uma identidade secreta para assumir o império.',
        poster: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: true,
        episodes: [
          {
            id: 'e1',
            number: 1,
            title: 'O Contrato Secreto (Episódio Grátis)',
            duration: '03 min',
            isVip: false,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
          },
          {
            id: 'e2',
            number: 2,
            title: 'A Revelação no Jantar de Gala',
            duration: '04 min',
            isVip: true,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'
          },
          {

            number: 3,
            title: 'A Queda dos Traidores',
            duration: '05 min',

            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
          }
        ]
      },
      {
        id: 's2',
        title: 'Obsessão Perigosa',
        category: 'Suspense & Romance IA',
        synopsis: 'Um CEO implacável descobre que a mulher que salvou sua vida desapareceu deixando apenas um colar misterioso.',
        poster: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: false,
        episodes: [
          {
            id: 'e201',
            number: 1,
            title: 'Encontro na Chuva (Grátis)',
            duration: '03 min',
            isVip: false,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
          },
          {
            id: 'e202',
            number: 2,
            title: 'Identidade Oculta',
            duration: '04 min',
            isVip: true,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
          }
        ]
      }
    ];

    const DEFAULT_COUPONS = [
      { id: 'c1', code: 'VIP7DIAS', type: 'days', value: 7, usesLeft: 20 },
      { id: 'c2', code: 'PROMO490', type: 'price', value: 4.90, usesLeft: 50 }
    ];

    const nowFormatted = () => {
      const d = new Date();
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' +
             d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    };

    const getDaysRemaining = (vipUntil) => {
      if (!vipUntil) return 0;
      const diff = vipUntil - Date.now();
      if (diff <= 0) return 0;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    };

    function App() {
      const isHydratedRef = useRef(false);
      const episodesSectionRef = useRef(null);
      const catalogSectionRef = useRef(null);

      const [seriesList, setSeriesList] = useState(() => {
        try {
          const s = localStorage.getItem('dup_series_v7') || localStorage.getItem('dup_series_v6');
          return s ? JSON.parse(s) : DEFAULT_SERIES;
        } catch { return DEFAULT_SERIES; }
      });

      const [users, setUsers] = useState(() => {
        try {
          const u = localStorage.getItem('dup_users_v7') || localStorage.getItem('dup_users_v6');
          return u ? JSON.parse(u) : [];
        } catch { return []; }
      });

      const [coupons, setCoupons] = useState(() => {
        try {
          const c = localStorage.getItem('dup_coupons_v7') || localStorage.getItem('dup_coupons_v6');
          return c ? JSON.parse(c) : DEFAULT_COUPONS;
        } catch { return DEFAULT_COUPONS; }
      });

      const [supportWhatsapp, setSupportWhatsapp] = useState(() => {
        return localStorage.getItem('dup_whatsapp_v7') || localStorage.getItem('dup_whatsapp_v6') || '5575991227668';
      });
      const [basePrice, setBasePrice] = useState(() => {
        return Number(localStorage.getItem('dup_price_v7') || localStorage.getItem('dup_price_v6')) || 9.90;
      });
      const [mpToken, setMpToken] = useState(() => {
        return localStorage.getItem('dup_mp_token_v7') || localStorage.getItem('dup_mp_token_v6') || localStorage.getItem('dup_mp_token') || '';
      });
      const [sbUrl, setSbUrl] = useState(() => {
        return FIXED_SUPABASE_URL || localStorage.getItem('dup_sb_url_v7') || localStorage.getItem('dup_sb_url_v6') || localStorage.getItem('dup_sb_url') || '';
      });
      const [sbKey, setSbKey] = useState(() => {
        return FIXED_SUPABASE_KEY || localStorage.getItem('dup_sb_key_v7') || localStorage.getItem('dup_sb_key_v6') || localStorage.getItem('dup_sb_key') || '';
      });
      const [adminStoredSecret, setAdminStoredSecret] = useState(() => {
        return localStorage.getItem('dup_adm_sec_v7') || localStorage.getItem('dup_adm_sec_v6') || 'YWRtaW4xMjM=';
      });

      const [showMpTokenPlain, setShowMpTokenPlain] = useState(false);

      const [currentUserId, setCurrentUserId] = useState(() => localStorage.getItem('dup_logged_user_v7') || localStorage.getItem('dup_logged_user_v6') || null);
      const [selectedSeriesId, setSelectedSeriesId] = useState('s1');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [activeEpisode, setActiveEpisode] = useState(null);
      const [nextEpisodePrompt, setNextEpisodePrompt] = useState(null);
      const [verticalPlayerMode, setVerticalPlayerMode] = useState(false);

      const [cloudConnected, setCloudConnected] = useState(false);
      const [configSavedMsg, setConfigSavedMsg] = useState('');

      // Modais de Cliente
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regWhatsapp, setRegWhatsapp] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [userAuthError, setUserAuthError] = useState('');
      const [legalModalText, setLegalModalText] = useState(null);

      // Cupom e PIX
      const [showCouponModal, setShowCouponModal] = useState(false);
      const [couponInput, setCouponInput] = useState('');
      const [couponMsg, setCouponMsg] = useState('');
      const [discountedPrice, setDiscountedPrice] = useState(null);

      const [showVipModal, setShowVipModal] = useState(false);
      const [pixLoading, setPixLoading] = useState(false);
      const [pixPaymentId, setPixPaymentId] = useState(null);
      const [pixQrCode, setPixQrCode] = useState('');
      const [pixQrBase64, setPixQrBase64] = useState('');
      const [pixCopied, setPixCopied] = useState(false);
      const [pixStatusMsg, setPixStatusMsg] = useState('');

      // Estado do ADM (100% Invisível para usuários comuns)
      const [adminUnlocked, setAdminUnlocked] = useState(false);
      const [adminTab, setAdminTab] = useState('lancamentos');

      // Edição de Série / Episódio
      const [editingSeriesId, setEditingSeriesId] = useState(null);
      const [editingEpisodeId, setEditingEpisodeId] = useState(null);

      // Uploads e Formulários do ADM
      const [uploadingField, setUploadingField] = useState('');
      const [uploadProgressMsg, setUploadProgressMsg] = useState('');

      const [newSerieTitle, setNewSerieTitle] = useState('');
      const [newSerieCategory, setNewSerieCategory] = useState('Mini Novelinha IA');
      const [newSerieSynopsis, setNewSerieSynopsis] = useState('');
      const [newSeriePoster, setNewSeriePoster] = useState('');
      const [newSerieBanner, setNewSerieBanner] = useState('');
      const [newSerieIsHero, setNewSerieIsHero] = useState(false);

      const [newEpSeriesId, setNewEpSeriesId] = useState('s1');
      const [newEpTitle, setNewEpTitle] = useState('');
      const [newEpNumber, setNewEpNumber] = useState(1);
      const [newEpDuration, setNewEpDuration] = useState('03 min');
      const [newEpThumb, setNewEpThumb] = useState('');
      const [newEpVideo, setNewEpVideo] = useState('');
      const [newEpIsVip, setNewEpIsVip] = useState(true);
      const [newEpComingSoon, setNewEpComingSoon] = useState(false);
      const [newEpVertical, setNewEpVertical] = useState(false);

      const [newCouponCode, setNewCouponCode] = useState('');
      const [newCouponType, setNewCouponType] = useState('days');
      const [newCouponVal, setNewCouponVal] = useState(7);
      const [newCouponUses, setNewCouponUses] = useState(20);

      const [currentPassCheck, setCurrentPassCheck] = useState('');
      const [newAdminPass, setNewAdminPass] = useState('');
      const [passChangeMsg, setPassChangeMsg] = useState('');

      // ===================================================================
      // SALVAMENTO AUTOMÁTICO IMEDIATO NO NAVEGADOR
      // ===================================================================
      useEffect(() => {
        localStorage.setItem('dup_mp_token_v7', mpToken.trim());
        localStorage.setItem('dup_mp_token_v6', mpToken.trim());
      }, [mpToken]);

      useEffect(() => {
        localStorage.setItem('dup_sb_url_v7', sbUrl.trim());
        localStorage.setItem('dup_sb_url_v6', sbUrl.trim());
      }, [sbUrl]);

      useEffect(() => {
        localStorage.setItem('dup_sb_key_v7', sbKey.trim());
        localStorage.setItem('dup_sb_key_v6', sbKey.trim());
      }, [sbKey]);

      useEffect(() => {
        localStorage.setItem('dup_whatsapp_v7', supportWhatsapp.trim());
      }, [supportWhatsapp]);

      useEffect(() => {
        localStorage.setItem('dup_price_v7', String(basePrice));
      }, [basePrice]);

      // Atualiza automaticamente o número do próximo episódio quando troca a série no ADM
      useEffect(() => {
        if (!editingEpisodeId) {
          const targetSerie = seriesList.find((s) => s.id === newEpSeriesId);
          if (targetSerie) {
            const maxNum = targetSerie.episodes.reduce((acc, ep) => Math.max(acc, Number(ep.number) || 0), 0);
            setNewEpNumber(maxNum + 1);
          }
        }
      }, [newEpSeriesId, seriesList, editingEpisodeId]);

      // ===================================================================
      // SINCRONIZAÇÃO COM SUPABASE (COM FALLBACK ANTI-FALHA DE COLUNA)
      // ===================================================================
      const buildSettingsPayload = () => ({
        mpToken: mpToken.trim(),
        supportWhatsapp: supportWhatsapp.trim(),
        basePrice: Number(basePrice) || 9.90,
        adminStoredSecret
      });

      const pullFromSupabase = async () => {
        if (!sbUrl.includes('supabase.co') || sbKey.length < 15 || !window.supabase) {
          isHydratedRef.current = true;
          return;
        }
        try {
          const supabase = window.supabase.createClient(sbUrl.trim(), sbKey.trim());
          const { data, error } = await supabase.from('app_state').select('*').eq('id', 1).single();
          if (!error && data) {
            setCloudConnected(true);
            if (Array.isArray(data.series_data) && data.series_data.length > 0) {
              setSeriesList(data.series_data);
            }
            if (Array.isArray(data.users_data) && data.users_data.length > 0) {
              setUsers(data.users_data);
            }
            if (Array.isArray(data.coupons_data) && data.coupons_data.length > 0) {
              const realCoupons = data.coupons_data.filter((c) => c.id !== '__SYS_CONFIG__');
              const embeddedConfig = data.coupons_data.find((c) => c.id === '__SYS_CONFIG__');
              if (realCoupons.length > 0) setCoupons(realCoupons);
              if (embeddedConfig) {
                if (embeddedConfig.mpToken) setMpToken(embeddedConfig.mpToken);
                if (embeddedConfig.supportWhatsapp) setSupportWhatsapp(embeddedConfig.supportWhatsapp);
                if (embeddedConfig.basePrice) setBasePrice(Number(embeddedConfig.basePrice));
                if (embeddedConfig.adminStoredSecret) setAdminStoredSecret(embeddedConfig.adminStoredSecret);
              }
            }
            if (data.settings_data && typeof data.settings_data === 'object') {
              if (data.settings_data.mpToken) setMpToken(data.settings_data.mpToken);
              if (data.settings_data.supportWhatsapp) setSupportWhatsapp(data.settings_data.supportWhatsapp);
              if (data.settings_data.basePrice) setBasePrice(Number(data.settings_data.basePrice));
              if (data.settings_data.adminStoredSecret) setAdminStoredSecret(data.settings_data.adminStoredSecret);
            }
          }
        } catch (e) {}
        isHydratedRef.current = true;
      };

      const pushToSupabase = async (
        nextS = seriesList,
        nextU = users,
        nextC = coupons,
        nextSettings = buildSettingsPayload()
      ) => {
        if (!isHydratedRef.current) return;
        if (!sbUrl.includes('supabase.co') || sbKey.length < 15 || !window.supabase) return;
        try {
          const supabase = window.supabase.createClient(sbUrl.trim(), sbKey.trim());
          const cleanCoupons = nextC.filter((c) => c.id !== '__SYS_CONFIG__');
          const couponsWithBackupConfig = [
            ...cleanCoupons,
            { id: '__SYS_CONFIG__', code: '__SYS_CONFIG__', usesLeft: 0, ...nextSettings }
          ];

          // Tenta salvar incluindo a coluna settings_data
          const { error } = await supabase.from('app_state').upsert({
            id: 1,
            series_data: nextS,
            users_data: nextU,
            coupons_data: couponsWithBackupConfig,
            settings_data: nextSettings,
            updated_at: new Date().toISOString()
          });

          if (!error) {
            setCloudConnected(true);
          } else {
            // Fallback automático caso a tabela antiga não tenha a coluna settings_data
            const { error: fallbackErr } = await supabase.from('app_state').upsert({
              id: 1,
              series_data: nextS,
              users_data: nextU,
              coupons_data: couponsWithBackupConfig,
              updated_at: new Date().toISOString()
            });
            if (!fallbackErr) setCloudConnected(true);
          }
        } catch (e) {}
      };

      useEffect(() => {
        pullFromSupabase();
      }, [sbUrl, sbKey]);

      useEffect(() => {
        localStorage.setItem('dup_series_v7', JSON.stringify(seriesList));
        pushToSupabase(seriesList, users, coupons);
      }, [seriesList]);

      useEffect(() => {
        localStorage.setItem('dup_users_v7', JSON.stringify(users));
        pushToSupabase(seriesList, users, coupons);
      }, [users]);

      useEffect(() => {
        localStorage.setItem('dup_coupons_v7', JSON.stringify(coupons));
        pushToSupabase(seriesList, users, coupons);
      }, [coupons]);

      useEffect(() => {
        if (currentUserId) localStorage.setItem('dup_logged_user_v7', currentUserId);
        else localStorage.removeItem('dup_logged_user_v7');
      }, [currentUserId]);

      // Verificação automática de vencimento dos 30 dias VIP
      useEffect(() => {
        const now = Date.now();
        let changed = false;
        const updated = users.map((u) => {
          if (u.isVip && u.vipUntil && u.vipUntil < now) {
            changed = true;
            return { ...u, isVip: false, paymentStatus: 'expired' };
          }
          return u;
        });
        if (changed) setUsers(updated);
      }, []);

      const currentUser = users.find((u) => u.id === currentUserId) || null;
      const heroSeries = seriesList.find((s) => s.isHeroLaunch) || seriesList[0];
      const selectedSeries = seriesList.find((s) => s.id === selectedSeriesId) || seriesList[0];
      const sortedSelectedEpisodes = [...(selectedSeries?.episodes || [])].sort(
        (a, b) => (Number(a.number) || 0) - (Number(b.number) || 0)
      );

      const allCategories = ['Todas', ...new Set(seriesList.map((s) => s.category))];
      const filteredSeries = seriesList.filter((s) => {
        const matchesCat = selectedCategory === 'Todas' || s.category === selectedCategory;
        const matchesSearch = s.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      // ===================================================================
      // UPLOAD DIRETO DE MÍDIA
      // ===================================================================
      const handleDirectFileUpload = async (file, targetField) => {
        if (!file) return;
        setUploadingField(targetField);
        setUploadProgressMsg(`Enviando "${file.name}"... aguarde.`);

        try {
          if (sbUrl.includes('supabase.co') && sbKey.length > 15 && window.supabase) {
            const supabase = window.supabase.createClient(sbUrl.trim(), sbKey.trim());
            const ext = file.name.split('.').pop();
            const fileName = `${targetField}_${Date.now()}.${ext}`;

            const { error } = await supabase.storage
              .from('midia-catalogo')
              .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (error) throw error;

            const { data: publicData } = supabase.storage
              .from('midia-catalogo')
              .getPublicUrl(fileName);

            applyUploadedUrl(targetField, publicData.publicUrl);
            setUploadProgressMsg('✅ Arquivo enviado e salvo na nuvem com sucesso!');
          } else {
            if (file.type.startsWith('image/') && file.size < 4 * 1024 * 1024) {
              const reader = new FileReader();
              reader.onloadend = () => {
                applyUploadedUrl(targetField, reader.result);
                setUploadProgressMsg('✅ Imagem carregada com sucesso!');
                setUploadingField('');
              };
              reader.readAsDataURL(file);
              return;
            } else {
              const blobUrl = URL.createObjectURL(file);
              applyUploadedUrl(targetField, blobUrl);
              setUploadProgressMsg('✅ Mídia pronta! (Conecte o Supabase na Aba 4 para funcionar em todos os celulares).');
            }
          }
        } catch (err) {
          setUploadProgressMsg('⚠️ Verifique se criou o bucket "midia-catalogo" marcado como Public no Supabase.');
        }
        setUploadingField('');
      };

      const applyUploadedUrl = (targetField, url) => {
        if (targetField === 'seriePoster') setNewSeriePoster(url);
        if (targetField === 'serieBanner') setNewSerieBanner(url);
        if (targetField === 'epThumb') setNewEpThumb(url);
        if (targetField === 'epVideo') setNewEpVideo(url);
      };

      // ===================================================================
      // CHECKOUT PIX AUTOMÁTICO
      // ===================================================================
      const openAutomaticPixCheckout = async (customPriceOverride = null) => {
        if (!currentUser) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        const chargeAmount = customPriceOverride || discountedPrice || basePrice;

        setShowVipModal(true);
        setPixStatusMsg('');
        setPixPaymentId(null);
        setPixQrCode('');
        setPixQrBase64('');
        setPixLoading(true);

        try {
          const res = await fetch('/api/criar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: currentUser.email,
              name: currentUser.name,
              userId: currentUser.id,
              mpToken: mpToken.trim(),
              customAmount: chargeAmount
            })
          });

          const data = await res.json();
          if (res.ok && data.paymentId) {
            setPixPaymentId(data.paymentId);
            setPixQrCode(data.qrCode);
            setPixQrBase64(data.qrCodeBase64);
            setPixStatusMsg('🔄 Aguardando pagamento... Assim que pagar no app do seu banco, seu acesso VIP libera sozinho!');
          } else {
            setPixStatusMsg('⚠️ Gerador automático em atualização. Clique no botão verde abaixo para liberar seu VIP via WhatsApp imediatamente!');
          }
        } catch (e) {
          setPixStatusMsg('⚠️ Não foi possível carregar o QR Code agora. Clique no botão verde abaixo para ativar seu VIP no WhatsApp!');
        }
        setPixLoading(false);
      };

      useEffect(() => {
        if (!showVipModal || !pixPaymentId || !currentUser) return;

        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `/api/verificar-pix?paymentId=${pixPaymentId}&mpToken=${encodeURIComponent(mpToken.trim())}`
            );
            const data = await res.json();

            if (data.status === 'approved') {
              const thirtyDaysMs = Date.now() + 30 * 24 * 60 * 60 * 1000;
              setUsers((prev) =>
                prev.map((u) =>
                  u.id === currentUser.id
                    ? { ...u, isVip: true, vipUntil: thirtyDaysMs, paymentStatus: 'approved' }
                    : u
                )
              );
              setPixStatusMsg('✅ PAGAMENTO APROVADO! Seus 30 dias de VIP já estão liberados!');
              clearInterval(interval);
              setTimeout(() => setShowVipModal(false), 2000);
            }
          } catch (err) {}
        }, 4000);

        return () => clearInterval(interval);
      }, [showVipModal, pixPaymentId, currentUser, mpToken]);

      // ===================================================================
      // RESGATE DE CUPOM
      // ===================================================================
      const handleRedeemCoupon = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowCouponModal(false);
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }
        const cleanCode = couponInput.trim().toUpperCase();
        const foundCoupon = coupons.find((c) => c.id !== '__SYS_CONFIG__' && c.code === cleanCode && c.usesLeft > 0);

        if (!foundCoupon) {
          setCouponMsg('❌ Cupom inválido ou esgotado.');
          return;
        }

        setCoupons((prev) =>
          prev.map((c) => (c.id === foundCoupon.id ? { ...c, usesLeft: c.usesLeft - 1 } : c))
        );

        if (foundCoupon.type === 'price') {
          setDiscountedPrice(Number(foundCoupon.value));
          setCouponInput('');
          setShowCouponModal(false);
          openAutomaticPixCheckout(Number(foundCoupon.value));
          return;
        }

        const extraMs = Number(foundCoupon.value) * 24 * 60 * 60 * 1000;
        const baseTime = currentUser.isVip && currentUser.vipUntil > Date.now() ? currentUser.vipUntil : Date.now();

        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id
              ? { ...u, isVip: true, vipUntil: baseTime + extraMs, paymentStatus: 'coupon' }
              : u
          )
        );

        setCouponInput('');
        setCouponMsg(`🎉 Cupom ativado! Você ganhou +${foundCoupon.value} dias de VIP!`);
      };

      // ===================================================================
      // LOGIN INTELIGENTE (CLIENTES + ENTRADA INVISÍVEL DO ADM)
      // ===================================================================
      const handleUserRegister = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const emailClean = regEmail.trim().toLowerCase();

        if (emailClean === 'admin' || emailClean === 'adm' || emailClean === 'admin@daumplay.com') {
          setUserAuthError('Este usuário é reservado. Use a aba Entrar.');
          return;
        }
        if (!regName.trim() || !emailClean || !regPassword.trim()) {
          setUserAuthError('Preencha todos os campos obrigatórios.');
          return;
        }
        if (users.some((u) => u.email.toLowerCase() === emailClean)) {
          setUserAuthError('Este e-mail já está cadastrado. Clique em Entrar.');
          return;
        }

        const newUser = {
          id: 'u_' + Date.now(),
          name: regName.trim(),
          email: emailClean,
          whatsapp: regWhatsapp.trim() || 'Não informado',
          password: regPassword,
          isVip: false,
          vipUntil: null,
          paymentStatus: 'none',
          watchedEpisodeIds: [],
          lastResume: null,
          isOnline: true,
          lastEntry: nowFormatted(),
          lastExit: 'Online agora',
          lastWatched: 'Acabou de criar conta'
        };

        setUsers((prev) => [newUser, ...prev]);
        setCurrentUserId(newUser.id);
        setShowAuthModal(false);
        setRegName('');
        setRegEmail('');
        setRegWhatsapp('');
        setRegPassword('');
      };

      const handleUserLogin = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const loginClean = regEmail.trim().toLowerCase();

        if (loginClean === 'admin' || loginClean === 'adm' || loginClean === 'admin@daumplay.com') {
          if (btoa(regPassword) === adminStoredSecret) {
            setAdminUnlocked(true);
            setShowAuthModal(false);
            setRegEmail('');
            setRegPassword('');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          } else {
            setUserAuthError('Credenciais incorretas.');
            return;
          }
        }

        const found = users.find(
          (u) => u.email.toLowerCase() === loginClean && u.password === regPassword
        );

        if (!found) {
          setUserAuthError('E-mail ou senha incorretos.');
          return;
        }

        setUsers((prev) =>
          prev.map((u) =>
            u.id === found.id
              ? { ...u, isOnline: true, lastEntry: nowFormatted(), lastExit: 'Online agora' }
              : u
          )
        );
        setCurrentUserId(found.id);
        setShowAuthModal(false);
        setRegEmail('');
        setRegPassword('');
      };

      const handleUserLogout = () => {
        if (!currentUser) return;
        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id ? { ...u, isOnline: false, lastExit: nowFormatted() } : u
          )
        );
        setCurrentUserId(null);
        setActiveEpisode(null);
      };

      const handleSelectSeriesCard = (serieId) => {
        setSelectedSeriesId(serieId);
        if (episodesSectionRef.current) {
          setTimeout(() => {
            episodesSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 80);
        }
      };

      const handlePlayEpisode = (episode, serieObj = selectedSeries) => {
        if (episode.comingSoon) {
          alert('🔥 Este episódio estreia em breve! Fique ligado.');
          return;
        }
        if (!currentUser) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        const hasValidVip = currentUser.isVip && (!currentUser.vipUntil || currentUser.vipUntil > Date.now());
        if (episode.isVip && !hasValidVip) {
          openAutomaticPixCheckout();
          return;
        }

        setVerticalPlayerMode(Boolean(episode.isVertical));
        setNextEpisodePrompt(null);
        setActiveEpisode(episode);

        setUsers((prev) =>
          prev.map((u) => {
            if (u.id !== currentUser.id) return u;
            const prevWatched = Array.isArray(u.watchedEpisodeIds) ? u.watchedEpisodeIds : [];
            const nextWatched = prevWatched.includes(episode.id) ? prevWatched : [...prevWatched, episode.id];
            return {
              ...u,
              watchedEpisodeIds: nextWatched,
              lastResume: {
                serieId: serieObj.id,
                epId: episode.id,
                title: `${serieObj.title} • Ep. ${episode.number}`
              },
              lastWatched: `${serieObj.title} - Ep. ${episode.number}`
            };
          })
        );
      };

      const currentEpIndex = activeEpisode
        ? sortedSelectedEpisodes.findIndex((e) => e.id === activeEpisode.id)
        : -1;
      const prevEpInList = currentEpIndex > 0 ? sortedSelectedEpisodes[currentEpIndex - 1] : null;
      const nextEpInList =
        currentEpIndex >= 0 && currentEpIndex < sortedSelectedEpisodes.length - 1
          ? sortedSelectedEpisodes[currentEpIndex + 1]
          : null;

      const handleVideoEnded = () => {
        if (nextEpInList && !nextEpInList.comingSoon) {
          setNextEpisodePrompt(nextEpInList);
        }
      };

      // ===================================================================
      // FUNÇÕES EXCLUSIVAS DO ADM (CRIAR + EDITAR + EXCLUIR)
      // ===================================================================
      const toggleUserVipByAdmin = (userId, days = 30) => {
        setUsers((prev) =>
          prev.map((u) => {
            if (u.id !== userId) return u;
            const nextVip = !u.isVip;
            return {
              ...u,
              isVip: nextVip,
              vipUntil: nextVip ? Date.now() + days * 24 * 60 * 60 * 1000 : null,
              paymentStatus: nextVip ? 'approved' : 'none'
            };
          })
        );
      };

      const toggleEpisodeVipQuick = (serieId, epId) => {
        setSeriesList((prev) =>
          prev.map((s) =>
            s.id !== serieId
              ? s
              : {
                  ...s,
                  episodes: s.episodes.map((ep) =>
                    ep.id === epId ? { ...ep, isVip: !ep.isVip } : ep
                  )
                }
          )
        );
      };

      const setSerieAsHeroQuick = (serieId) => {
        setSeriesList((prev) =>
          prev.map((s) => ({ ...s, isHeroLaunch: s.id === serieId }))
        );
      };

      const startEditingSeries = (serie) => {
        setEditingSeriesId(serie.id);
        setNewSerieTitle(serie.title);
        setNewSerieCategory(serie.category);
        setNewSerieSynopsis(serie.synopsis);
        setNewSeriePoster(serie.poster);
        setNewSerieBanner(serie.banner);
        setNewSerieIsHero(Boolean(serie.isHeroLaunch));
        setAdminTab('lancamentos');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const startEditingEpisode = (serieId, ep) => {
        setEditingEpisodeId(ep.id);
        setNewEpSeriesId(serieId);
        setNewEpNumber(ep.number);
        setNewEpTitle(ep.title);
        setNewEpDuration(ep.duration || '03 min');
        setNewEpThumb(ep.thumb);
        setNewEpVideo(ep.videoUrl);
        setNewEpIsVip(Boolean(ep.isVip));
        setNewEpComingSoon(Boolean(ep.comingSoon));
        setNewEpVertical(Boolean(ep.isVertical));
        setAdminTab('lancamentos');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteSeries = (serieId) => {
        if (seriesList.length <= 1) return;
        const remaining = seriesList.filter((s) => s.id !== serieId);
        setSeriesList(remaining);
        setSelectedSeriesId(remaining[0].id);
      };

      const handleDeleteEpisode = (serieId, epId) => {
        setSeriesList((prev) =>
          prev.map((s) =>
            s.id === serieId ? { ...s, episodes: s.episodes.filter((e) => e.id !== epId) } : s
          )
        );
      };

      const handleCreateOrUpdateSeries = (e) => {
        e.preventDefault();
        if (!newSerieTitle.trim()) return;

        if (editingSeriesId) {
          setSeriesList((prev) =>
            prev.map((s) => {
              const updatedHero = newSerieIsHero ? s.id === editingSeriesId : s.isHeroLaunch;
              if (s.id !== editingSeriesId) {
                return newSerieIsHero ? { ...s, isHeroLaunch: false } : s;
              }
              return {
                ...s,
                title: newSerieTitle.trim(),
                category: newSerieCategory.trim() || 'Mini Novelinha IA',
                synopsis: newSerieSynopsis.trim() || 'Produção original Da Um Play IA.',
                poster: newSeriePoster.trim() || s.poster,
                banner: newSerieBanner.trim() || s.banner,
                isHeroLaunch: updatedHero
              };
            })
          );
          setEditingSeriesId(null);
        } else {
          const created = {
            id: 's_' + Date.now(),
            title: newSerieTitle.trim(),
            category: newSerieCategory.trim() || 'Mini Novelinha IA',
            synopsis: newSerieSynopsis.trim() || 'Produção original Da Um Play IA.',
            poster: newSeriePoster.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
            banner: newSerieBanner.trim() || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
            isHeroLaunch: newSerieIsHero,
            episodes: []
          };

          setSeriesList((prev) => {
            const base = newSerieIsHero ? prev.map((s) => ({ ...s, isHeroLaunch: false })) : prev;
            return [created, ...base];
          });
          setSelectedSeriesId(created.id);
          setNewEpSeriesId(created.id);
        }

        setNewSerieTitle('');
        setNewSerieSynopsis('');
        setNewSeriePoster('');
        setNewSerieBanner('');
        setNewSerieIsHero(false);
      };

      const handleAddOrUpdateEpisode = (e) => {
        e.preventDefault();
        if (!newEpTitle.trim()) return;

        if (editingEpisodeId) {
          setSeriesList((prev) =>
            prev.map((s) =>
              s.id !== newEpSeriesId
                ? s
                : {
                    ...s,
                    episodes: s.episodes.map((ep) =>
                      ep.id !== editingEpisodeId
                        ? ep
                        : {
                            ...ep,
                            number: Number(newEpNumber),
                            title: newEpTitle.trim(),
                            duration: newEpDuration || '03 min',
                            isVip: newEpIsVip,
                            comingSoon: newEpComingSoon,
                            isVertical: newEpVertical,
                            thumb: newEpThumb.trim() || ep.thumb,
                            videoUrl: newEpVideo.trim() || ep.videoUrl
                          }
                    )
                  }
            )
          );
          setEditingEpisodeId(null);
        } else {
          const newEp = {
            id: 'ep_' + Date.now(),
            number: Number(newEpNumber),
            title: newEpTitle.trim(),
            duration: newEpDuration || '03 min',
            isVip: newEpIsVip,
            comingSoon: newEpComingSoon,
            isVertical: newEpVertical,
            thumb: newEpThumb.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
            videoUrl: newEpVideo.trim() || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
          };

          setSeriesList((prev) =>
            prev.map((s) =>
              s.id === newEpSeriesId ? { ...s, episodes: [...s.episodes, newEp] } : s
            )
          );
        }

        setNewEpTitle('');
        setNewEpThumb('');
        setNewEpVideo('');
        setNewEpComingSoon(false);
      };

      const handleCreateCoupon = (e) => {
        e.preventDefault();
        if (!newCouponCode.trim()) return;
        const created = {
          id: 'c_' + Date.now(),
          code: newCouponCode.trim().toUpperCase(),
          type: newCouponType,
          value: Number(newCouponVal),
          usesLeft: Number(newCouponUses) || 10
        };
        setCoupons((prev) => [created, ...prev]);
        setNewCouponCode('');
      };

      const visibleCoupons = coupons.filter((c) => c.id !== '__SYS_CONFIG__');
      const activePriceDisplay = (discountedPrice || basePrice).toFixed(2).replace('.', ',');

      return (
        <div className="min-h-screen bg-[#07080c] text-white flex flex-col">
          {/* BARRA DO TOPO LIMPA E PROFISSIONAL */}
          <header className="sticky top-0 z-40 bg-[#07080c]/95 backdrop-blur-md border-b border-white/10 px-4 md:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-6">
              <button
                onClick={() => {
                  setSelectedCategory('Todas');
                  setSearchQuery('');
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                className="flex items-center gap-2.5 text-left focus:outline-none select-none"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#ff1722] to-[#00d4ff] p-0.5 shadow-lg shadow-[#ff1722]/20">
                  <div className="w-full h-full bg-[#07080c] rounded-[10px] flex items-center justify-center font-black text-[#ff1722]">
                    ▶
                  </div>
                </div>
                <div>
                  <span className="text-lg md:text-xl font-black tracking-tighter text-white">
                    DA UM <span className="text-[#ff1722]">PLAY</span>{' '}
                    <span className="text-[#00d4ff]">IA</span>
                  </span>
                  <span className="block text-[10px] uppercase tracking-widest text-gray-400">
                    Streaming Oficial
                  </span>
                </div>
              </button>

              <div className="hidden md:block">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="🔍 Buscar novelinha ou série..."
                  className="px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs text-white focus:border-[#00d4ff] focus:outline-none w-56"
                />
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => {
                  setCouponMsg('');
                  setShowCouponModal(true);
                }}
                className="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/15 text-[11px] font-bold text-[#00d4ff]"
              >
                🎟️ Cupom
              </button>

              {!currentUser ? (
                <>
                  <button
                    onClick={() => {
                      setAuthMode('login');
                      setUserAuthError('');
                      setShowAuthModal(true);
                    }}
                    className="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/15 transition"
                  >
                    Entrar
                  </button>
                  <button
                    onClick={() => {
                      setAuthMode('register');
                      setUserAuthError('');
                      setShowAuthModal(true);
                    }}
                    className="px-4 py-1.5 rounded-xl text-xs font-extrabold bg-[#ff1722] hover:bg-[#e0121c] text-white shadow-lg shadow-[#ff1722]/30 transition"
                  >
                    Criar Conta
                  </button>
                </>
              ) : (
                <div className="flex items-center gap-2">
                  {currentUser.isVip ? (
                    <span className="px-3 py-1.5 rounded-full text-[11px] font-black bg-[#00d4ff]/20 text-[#00d4ff] border border-[#00d4ff]/50">
                      👑 VIP ({getDaysRemaining(currentUser.vipUntil)}d)
                    </span>
                  ) : (
                    <button
                      onClick={() => openAutomaticPixCheckout()}
                      className="px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-[#ff1722] to-[#00d4ff] text-white shadow-lg"
                    >
                      👑 Assinar VIP • R$ {activePriceDisplay}
                    </button>
                  )}
                  <span className="hidden sm:inline text-xs font-bold text-gray-200">{currentUser.name}</span>
                  <button
                    onClick={handleUserLogout}
                    className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-[#ff1722] text-xs font-bold transition"
                  >
                    Sair
                  </button>
                </div>
              )}

              {adminUnlocked && (
                <button
                  onClick={() => setAdminUnlocked(false)}
                  className="px-3 py-1.5 rounded-xl bg-[#ff1722] text-white text-xs font-black shadow-lg"
                >
                  Fechar ADM
                </button>
              )}
            </div>
          </header>

          {/* PAINEL DO ADM MASTER (INVISÍVEL PARA CLIENTES) */}
          {adminUnlocked && (
            <section className="bg-[#0d1017] border-b-2 border-[#00d4ff] p-6 shadow-2xl">
              <div className="max-w-6xl mx-auto space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-white/10">
                  <div>
                    <h2 className="text-lg font-black uppercase text-[#00d4ff] flex items-center gap-2">
                      🛡️ Painel Master do Administrador
                      <span className={`text-[11px] px-2.5 py-0.5 rounded-full ${cloudConnected ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-300'}`}>
                        {cloudConnected ? '● Nuvem Supabase Online' : '● Salvo Neste Aparelho'}
                      </span>
                    </h2>
                    <p className="text-xs text-gray-400">
                      Painel oculto. Você pode criar ou editar qualquer série, episódio, cliente ou chave PIX.
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() => setAdminTab('lancamentos')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'lancamentos' ? 'bg-[#ff1722] text-white' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      1. Novelinhas & Episódios
                    </button>
                    <button
                      onClick={() => setAdminTab('usuarios')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'usuarios' ? 'bg-[#ff1722] text-white' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      2. Clientes & VIP ({users.length})
                    </button>
                    <button
                      onClick={() => setAdminTab('cupons')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'cupons' ? 'bg-[#ff1722] text-white' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      3. Cupons ({visibleCoupons.length})
                    </button>
                    <button
                      onClick={() => setAdminTab('automacao')}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                        adminTab === 'automacao' ? 'bg-[#00d4ff] text-[#07080c]' : 'bg-white/5 text-gray-300'
                      }`}
                    >
                      4. PIX, Nuvem & Senha ADM
                    </button>
                  </div>
                </div>

                {uploadProgressMsg && (
                  <div className="p-3 rounded-xl bg-[#00d4ff]/15 border border-[#00d4ff]/40 text-[#00d4ff] text-xs font-bold text-center">
                    {uploadProgressMsg}
                  </div>
                )}

                {adminTab === 'lancamentos' && (
                  <div className="grid md:grid-cols-2 gap-6">
                    <form onSubmit={handleCreateOrUpdateSeries} className="bg-[#07080c] border border-white/10 rounded-2xl p-5 space-y-3">
                      <div className="flex items-center justify-between">
                        <h3 className="text-sm font-black uppercase text-[#00d4ff]">
                          {editingSeriesId ? '✏️ Editando Série Selecionada' : '1. Criar Nova Série / Novelinha'}
                        </h3>
                        {editingSeriesId && (
                          <button
                            type="button"
                            onClick={() => {
                              setEditingSeriesId(null);
                              setNewSerieTitle('');
                              setNewSerieSynopsis('');
                              setNewSeriePoster('');
                              setNewSerieBanner('');
                            }}
                            className="text-xs text-red-400 font-bold"
                          >
                            Cancelar Edição
                          </button>
                        )}
                      </div>
                      <input
                        type="text"
                        required
                        value={newSerieTitle}
                        onChange={(e) => setNewSerieTitle(e.target.value)}
                        placeholder="Nome da Série ou Novelinha"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-[#0d1017] border border-white/15 text-xs text-white"
                      />
                      <input
                        type="text"
                        value={newSerieCategory}
                        onChange={(e) => setNewSerieCategory(e.target.value)}
                        placeholder="Categoria (Ex: Mini Novelinha IA, Drama IA)"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-[#0d1017] border border-white/15 text-xs text-white"
                      />
                      <textarea
                        rows="2"
                        value={newSerieSynopsis}
                        onChange={(e) => setNewSerieSynopsis(e.target.value)}
                        placeholder="Sinopse da história..."
                        className="w-full px-3.5 py-2.5 rounded-xl bg-[#0d1017] border border-white/15 text-xs text-white"
                      />
                      <div className="p-3 rounded-xl bg-[#0d1017] border border-dashed border-[#00d4ff]/50 space-y-1">
                        <label className="block text-xs font-bold text-[#00d4ff]">📁 Capa Vertical (Pôster):</label>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleDirectFileUpload(e.target.files[0], 'seriePoster')}
                          className="w-full text-xs text-gray-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#00d4ff] file:text-[#07080c]"
                        />
                      </div>
                      <div className="p-3 rounded-xl bg-[#0d1017] border border-dashed border-white/20 space-y-1">
                        <label className="block text-xs font-bold text-gray-300">📁 Banner Horizontal do Topo:</label>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleDirectFileUpload(e.target.files[0], 'serieBanner')}
                          className="w-full text-xs text-gray-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-white/15 file:text-white"

                        onClick={() => startEditingSeries(serie)}
                        className="px-2 py-1 rounded bg-white/10 text-white font-bold"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        onClick={() => handleDeleteSeries(serie.id)}
                        className="px-2 py-1 rounded bg-red-500/20 text-red-400 font-bold"
                      >
                        Excluir
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>

            <div ref={episodesSectionRef} className="bg-[#0d1017] border border-white/10 rounded-3xl p-6 scroll-mt-20">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-6">
                <div>
                  <span className="text-[11px] uppercase tracking-wider text-[#00d4ff] font-bold">{selectedSeries.category}</span>
                  <h3 className="text-2xl font-black">{selectedSeries.title} — Episódios</h3>
                  <p className="text-xs text-gray-400 mt-1">{selectedSeries.synopsis}</p>
                </div>
                <span className="text-xs font-bold text-[#00d4ff] bg-[#00d4ff]/10 px-3 py-1 rounded-full">
                  {sortedSelectedEpisodes.length} episódios disponíveis
                </span>
              </div>

              <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-5">
                {sortedSelectedEpisodes.map((ep) => {
                  const locked = ep.isVip && (!currentUser || !currentUser.isVip);
                  const alreadyWatched = currentUser?.watchedEpisodeIds?.includes(ep.id);

                  return (
                    <div
                      key={ep.id}
                      onClick={() => handlePlayEpisode(ep, selectedSeries)}
                      className="cursor-pointer rounded-2xl overflow-hidden bg-[#07080c] border border-white/10 hover:border-[#00d4ff] transition group"
                    >
                      <div className="aspect-video relative">
                        <img src={ep.thumb} alt={ep.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                        <div className="absolute inset-0 bg-black/50 flex items-center justify-center">
                          <div className="w-12 h-12 rounded-full bg-[#ff1722] flex items-center justify-center font-bold shadow-lg">
                            {ep.comingSoon ? '⏳' : locked ? '🔒' : '▶'}
                          </div>
                        </div>

                        {alreadyWatched && (
                          <span className="absolute top-2.5 left-2.5 px-2 py-0.5 rounded bg-black/80 text-emerald-400 text-[10px] font-bold">
                            ✓ Assistido
                          </span>
                        )}

                        <span
                          className={`absolute top-2.5 right-2.5 px-2.5 py-0.5 rounded-md text-[10px] font-black uppercase ${
                            ep.comingSoon
                              ? 'bg-amber-400 text-black'
                              : ep.isVip
                              ? 'bg-[#00d4ff] text-[#07080c]'
                              : 'bg-emerald-500 text-black'
                          }`}
                        >
                          {ep.comingSoon ? '🔥 EM BREVE' : ep.isVip ? '🔒 VIP' : '🔓 GRÁTIS'}
                        </span>
                      </div>

                      <div className="p-4">
                        <div className="flex items-center justify-between text-xs text-gray-400 mb-1">
                          <span>Episódio {ep.number} {ep.isVertical ? '• 📱 Vertical' : ''}</span>
                          <span>{ep.duration}</span>
                        </div>
                        <h4 className="font-bold text-sm text-white">{ep.title}</h4>

                        {adminUnlocked && (
                          <div
                            onClick={(e) => e.stopPropagation()}
                            className="mt-3 pt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-1 text-[11px]"
                          >
                            <button
                              onClick={() => toggleEpisodeVipQuick(selectedSeries.id, ep.id)}
                              className="px-2 py-1 rounded bg-white/10 hover:bg-white/20 font-bold text-[#00d4ff]"
                            >
                              {ep.isVip ? 'Mudar p/ Grátis' : 'Mudar p/ VIP'}
                            </button>
                            <button
                              onClick={() => startEditingEpisode(selectedSeries.id, ep)}
                              className="px-2 py-1 rounded bg-white/10 text-white font-bold"
                            >
                              ✏️ Editar
                            </button>
                            <button
                              onClick={() => handleDeleteEpisode(selectedSeries.id, ep.id)}
                              className="text-red-400 font-bold"
                            >
                              Apagar
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* BARRA INFERIOR ESTILO APP NO CELULAR */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0a0c12]/95 backdrop-blur-md border-t border-white/10 px-4 py-2 flex items-center justify-around text-[11px] font-bold">
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="flex flex-col items-center gap-0.5 text-gray-300 hover:text-white"
            >
              <span>🏠</span>
              <span>Início</span>
            </button>
            <button
              onClick={() => catalogSectionRef.current?.scrollIntoView({ behavior: 'smooth' })}
              className="flex flex-col items-center gap-0.5 text-gray-300 hover:text-white"
            >
              <span>🎬</span>
              <span>Séries</span>
            </button>
            <button
              onClick={() => openAutomaticPixCheckout()}
              className="flex flex-col items-center gap-0.5 text-[#00d4ff]"
            >
              <span>👑</span>
              <span>VIP</span>
            </button>
            <button
              onClick={() => {
                setCouponMsg('');
                setShowCouponModal(true);
              }}
              className="flex flex-col items-center gap-0.5 text-gray-300 hover:text-white"
            >
              <span>🎟️</span>
              <span>Cupom</span>
            </button>
            <button
              onClick={() => {
                if (currentUser) {
                  alert(`Conectado como: ${currentUser.name}\nStatus: ${currentUser.isVip ? 'VIP Ativo (' + getDaysRemaining(currentUser.vipUntil) + ' dias)' : 'Conta Grátis'}`);
                } else {
                  setAuthMode('login');
                  setShowAuthModal(true);
                }
              }}
              className="flex flex-col items-center gap-0.5 text-gray-300 hover:text-white"
            >
              <span>👤</span>
              <span>{currentUser ? 'Perfil' : 'Entrar'}</span>
            </button>
          </nav>

          {/* PLAYER DE VÍDEO BLINDADO COM BOTÕES PRÓXIMO / ANTERIOR */}
          {activeEpisode && (
            <div
              onContextMenu={(e) => e.preventDefault()}
              className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-3"
            >
              <div
                className={`bg-[#0d1017] border border-white/15 rounded-3xl w-full overflow-hidden ${
                  verticalPlayerMode ? 'max-w-sm' : 'max-w-4xl'
                }`}
              >
                <div className="p-3.5 border-b border-white/10 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span className="text-[11px] font-bold text-[#ff1722]">
                      {selectedSeries.title} • EP. {activeEpisode.number}
                    </span>
                    <h3 className="text-sm font-black">{activeEpisode.title}</h3>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {prevEpInList && (
                      <button
                        onClick={() => handlePlayEpisode(prevEpInList, selectedSeries)}
                        className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-bold text-gray-200"
                      >
                        ⏮️ Anterior
                      </button>
                    )}
                    {nextEpInList && (
                      <button
                        onClick={() => handlePlayEpisode(nextEpInList, selectedSeries)}
                        className="px-2.5 py-1 rounded-lg bg-[#00d4ff]/20 hover:bg-[#00d4ff]/30 text-[11px] font-bold text-[#00d4ff]"
                      >
                        Próximo ⏭️
                      </button>
                    )}
                    <button
                      onClick={() => setVerticalPlayerMode(!verticalPlayerMode)}
                      className="px-2.5 py-1 rounded-lg bg-white/10 text-[11px] font-bold text-gray-300"
                    >
                      {verticalPlayerMode ? '🖥️ Horizontal' : '📱 Vertical'}
                    </button>
                    <button
                      onClick={() => {
                        setActiveEpisode(null);
                        setNextEpisodePrompt(null);
                      }}
                      className="px-3 py-1 rounded-lg bg-[#ff1722] text-xs font-bold"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                <div className={`bg-black relative ${verticalPlayerMode ? 'aspect-[9/16] max-h-[78vh] mx-auto' : 'aspect-video'}`}>
                  <video
                    key={activeEpisode.id}
                    src={activeEpisode.videoUrl}
                    controls
                    autoPlay
                    playsInline
                    controlsList="nodownload noplaybackrate"
                    disablePictureInPicture
                    onContextMenu={(e) => e.preventDefault()}
                    onEnded={handleVideoEnded}
                    className="w-full h-full object-contain"
                  />

                  {nextEpisodePrompt && (
                    <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center space-y-4">
                      <span className="text-xs font-black uppercase text-[#00d4ff]">Próximo Episódio</span>
                      <h4 className="text-xl font-black">
                        Ep. {nextEpisodePrompt.number} — {nextEpisodePrompt.title}
                      </h4>
                      <button
                        onClick={() => {
                          const target = nextEpisodePrompt;
                          setActiveEpisode(null);
                          setNextEpisodePrompt(null);
                          handlePlayEpisode(target, selectedSeries);
                        }}
                        className="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-[#ff1722] to-[#00d4ff] text-white font-black text-xs uppercase shadow-2xl"
                      >
                        {nextEpisodePrompt.isVip && (!currentUser || !currentUser.isVip)
                          ? `🔒 Desbloquear Episódio VIP (R$ ${activePriceDisplay})`
                          : '▶ Assistir Próximo Episódio Agora'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CUPOM */}
          {showCouponModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <form
                onSubmit={handleRedeemCoupon}
                className="bg-[#0d1017] border border-[#00d4ff] rounded-3xl max-w-sm w-full p-6 space-y-4 relative text-center"
              >
                <button
                  type="button"
                  onClick={() => setShowCouponModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="text-3xl">🎟️</div>
                <h3 className="text-lg font-black">Ativar Cupom Promocional</h3>
                <input
                  type="text"
                  required
                  placeholder="DIGITE SEU CUPOM"
                  value={couponInput}
                  onChange={(e) => setCouponInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-center text-sm font-black uppercase text-[#00d4ff]"
                />
                {couponMsg && <p className="text-xs font-bold text-amber-300">{couponMsg}</p>}
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-[#00d4ff] text-[#07080c] font-black text-xs uppercase"
                >
                  Resgatar Agora
                </button>
              </form>
            </div>
          )}

          {/* MODAL PIX AUTOMÁTICO + PLANO B DE SUPORTE */}
          {showVipModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border-2 border-[#00d4ff] rounded-3xl max-w-md w-full p-6 space-y-4 relative text-center">
                <button
                  onClick={() => setShowVipModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="text-3xl">👑</div>
                <h3 className="text-xl font-black">Acesso VIP Completo — 30 Dias</h3>
                <p className="text-xs text-gray-400">Assista todas as séries e mini novelinhas sem limites.</p>
                <div className="text-3xl font-black text-[#00d4ff]">R$ {activePriceDisplay}</div>

                {pixLoading && (
                  <div className="py-6 space-y-2">
                    <p className="text-xs text-[#00d4ff] font-bold animate-pulse">Gerando QR Code PIX seguro...</p>
                  </div>
                )}

                {pixQrBase64 && (
                  <img
                    src={`data:image/png;base64,${pixQrBase64}`}
                    alt="QR Code PIX"
                    className="w-48 h-48 mx-auto rounded-xl border-4 border-white shadow-lg"
                  />
                )}

                {pixQrCode && (
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(pixQrCode);
                      setPixCopied(true);
                      setTimeout(() => setPixCopied(false), 3000);
                    }}
                    className="w-full py-3.5 rounded-xl bg-[#00d4ff] text-[#07080c] text-xs font-black uppercase shadow-lg"
                  >
                    {pixCopied ? '✅ Código PIX Copiado!' : `📋 Copiar Código PIX (R$ ${activePriceDisplay})`}
                  </button>
                )}

                {pixStatusMsg && (
                  <div className="p-3 rounded-xl bg-white/5 border border-white/10 text-xs text-amber-300 font-semibold">
                    {pixStatusMsg}
                  </div>
                )}

                <a
                  href={`https://wa.me/${supportWhatsapp}?text=${encodeURIComponent(
                    `Olá! Quero ativar meu Acesso VIP de R$ ${activePriceDisplay} na plataforma Da Um Play IA. Meu e-mail é: ${currentUser?.email || ''}`
                  )}`}
                  target="_blank"
                  rel="noreferrer"
                  className="block w-full py-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 text-xs font-extrabold hover:bg-emerald-500/30 transition"
                >
                  💬 Já paguei / Enviar Comprovante no WhatsApp
                </a>
              </div>
            </div>
          )}

          {/* MODAL DE LOGIN E CADASTRO */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border border-white/15 rounded-3xl max-w-md w-full p-6 space-y-4 relative">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="flex gap-2 bg-[#07080c] p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('login');
                      setUserAuthError('');
                    }}
                    className={`flex-1 py-2 rounded-lg text-xs font-black uppercase ${
                      authMode === 'login' ? 'bg-[#ff1722] text-white' : 'text-gray-400'
                    }`}
                  >
                    Entrar
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('register');
                      setUserAuthError('');
                    }}
                    className={`flex-1 py-2 rounded-lg text-xs font-black uppercase ${
                      authMode === 'register' ? 'bg-[#00d4ff] text-[#07080c]' : 'text-gray-400'
                    }`}
                  >
                    Criar Conta
                  </button>
                </div>

                {authMode === 'register' ? (
                  <form onSubmit={handleUserRegister} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Seu Nome Completo"
                      value={regName}
                      onChange={(e) => setRegName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="email"
                      required
                      placeholder="Seu Melhor E-mail"
                      value={regEmail}
                      onChange={(e) => setRegEmail(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="tel"
                      placeholder="Seu WhatsApp com DDD"
                      value={regWhatsapp}
                      onChange={(e) => setRegWhatsapp(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="password"
                      required
                      placeholder="Crie uma Senha"
                      value={regPassword}
                      onChange={(e) => setRegPassword(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    {userAuthError && <p className="text-xs text-[#ff1722] font-bold">{userAuthError}</p>}
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-[#00d4ff] text-[#07080c] font-black text-xs uppercase"
                    >
                      Criar Minha Conta Grátis
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleUserLogin} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Seu E-mail de Acesso"
                      value={regEmail}
                      onChange={(e) => setRegEmail(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="password"
                      required
                      placeholder="Sua Senha"
                      value={regPassword}
                      onChange={(e) => setRegPassword(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-xs text-white"
                    />
                    {userAuthError && <p className="text-xs text-[#ff1722] font-bold">{userAuthError}</p>}
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-[#ff1722] text-white font-black text-xs uppercase"
                    >
                      Entrar na Plataforma
                    </button>
                    <a
                      href={`https://wa.me/${supportWhatsapp}?text=Ol%C3%A1%2C%20esqueci%20minha%20senha%20no%20Da%20Um%20Play%20IA`}
                      target="_blank"
                      rel="noreferrer"
                      className="block text-center text-xs text-gray-400 hover:text-[#00d4ff] pt-1"
                    >
                      Esqueceu a senha? Falar com o Suporte
                    </a>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODAL DE TERMOS E PRIVACIDADE */}
          {legalModalText && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border border-white/15 rounded-3xl max-w-lg w-full p-6 space-y-4 relative">
                <button
                  onClick={() => setLegalModalText(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <h3 className="text-base font-black text-[#00d4ff]">{legalModalText.title}</h3>
                <p className="text-xs text-gray-300 leading-relaxed">{legalModalText.body}</p>
                <button
                  onClick={() => setLegalModalText(null)}
                  className="w-full py-2.5 rounded-xl bg-white/10 text-xs font-bold"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          {/* RODAPÉ PROFISSIONAL DE STREAMING */}
          <footer className="bg-[#0a0c12] border-t border-white/10 pt-10 pb-8 px-6 text-xs text-gray-400">
            <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 pb-8 border-b border-white/10">
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <span className="text-base font-black tracking-tighter text-white">
                    DA UM <span className="text-[#ff1722]">PLAY</span> <span className="text-[#00d4ff]">IA</span>
                  </span>
                </div>
                <p className="text-xs text-gray-500 leading-relaxed">
                  Plataforma digital de séries curtas, mini novelinhas e produções originais criadas com Inteligência Artificial.
                </p>
              </div>

              <div className="space-y-2">
                <h4 className="text-white font-bold uppercase text-[11px] tracking-wider">Segurança & Acesso</h4>
                <ul className="space-y-1.5 text-gray-400">
                  <li>🔒 Pagamento 100% Seguro via PIX Automático</li>
                  <li>⚡ Liberação Imediata após confirmação</li>
                  <li>📱 Compatível com Celular, Tablet e Computador</li>
                </ul>
              </div>

              <div className="space-y-3">
                <h4 className="text-white font-bold uppercase text-[11px] tracking-wider">Central de Atendimento</h4>
                <p className="text-xs text-gray-500">Dúvidas sobre assinatura ou suporte técnico?</p>
                <a
                  href={`https://wa.me/${supportWhatsapp}?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20na%20plataforma%20Da%20Um%20Play%20IA`}
                  target="_blank"
                  rel="noreferrer"
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 font-bold text-xs hover:bg-emerald-500/25 transition"
                >
                  💬 Atendimento via WhatsApp
                </a>
              </div>
            </div>

            <div className="max-w-6xl mx-auto pt-6 flex flex-wrap items-center justify-between gap-4 text-[11px] text-gray-500">
              <span>© 2026 Da Um Play IA. Todos os direitos reservados. Proibida a reprodução ou download.</span>
              <div className="flex gap-4">
                <button
                  onClick={() =>
                    setLegalModalText({
                      title: 'Termos de Uso',
                      body: 'O acesso VIP concede direito de visualização pessoal por 30 dias corridos na plataforma Da Um Play IA. É estritamente proibido gravar, copiar ou redistribuir os vídeos protegidos por direitos autorais.'
                    })
                  }
                  className="hover:text-gray-300"
                >
                  Termos de Uso
                </button>
                <button
                  onClick={() =>
                    setLegalModalText({
                      title: 'Política de Privacidade',
                      body: 'Seus dados de acesso (nome, e-mail e telefone) são protegidos e utilizados exclusivamente para liberação da sua assinatura VIP e suporte ao assinante.'
                    })
                  }
                  className="hover:text-gray-300"
                >
                  Privacidade
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
