<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07080c" />
  <title>Da Um Play IA — Séries & Mini Novelinhas VIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-[#07080c] text-white font-sans antialiased selection:bg-[#ff1722] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_SERIES = [
      {
        id: 's1',
        title: 'A Herdeira de Ferro IA',
        category: 'Mini Novelinha IA',
        synopsis: 'Humilhada pela família bilionária, ela retorna cinco anos depois com uma identidade secreta para assumir o império.',
        poster: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: true,
        episodes: [
          {
            id: 'e1',
            number: 1,
            title: 'O Contrato Secreto (Episódio Grátis)',
            duration: '03 min',
            isVip: false,
            comingSoon: false,

            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
          },
          {

            title: 'A Revelação no Jantar de Gala',
            duration: '04 min',
            isVip: true,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'
          },
          {
            id: 'e3',
            number: 3,
            title: 'A Queda dos Traidores',
            duration: '05 min',
            isVip: true,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
          }
        ]
      },
      {
        id: 's2',
        title: 'Obsessão Perigosa',
        category: 'Suspense & Romance IA',
        synopsis: 'Um CEO implacável descobre que a mulher que salvou sua vida desapareceu deixando apenas um colar misterioso.',
        poster: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80',
        banner: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1600&q=80',
        isHeroLaunch: false,
        episodes: [
          {
            id: 'e201',
            number: 1,
            title: 'Encontro na Chuva (Grátis)',
            duration: '03 min',
            isVip: false,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
          },
          {
            id: 'e202',
            number: 2,
            title: 'Identidade Oculta',
            duration: '04 min',
            isVip: true,
            comingSoon: false,
            isVertical: false,
            thumb: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=600&q=80',
            videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
          }
        ]
      }
    ];

    const DEFAULT_USERS = [
      {
        id: 'u_demo_1',
        name: 'Assinante Exemplo',
        email: 'cliente@exemplo.com',
        whatsapp: '11999990000',
        password: '123',
        isVip: true,
        vipUntil: Date.now() + 30 * 24 * 60 * 60 * 1000,
        paymentStatus: 'approved',
        watchedEpisodeIds: ['e1'],
        lastResume: { serieId: 's1', epId: 'e1', title: 'Ep. 1 - O Contrato Secreto' },
        isOnline: false,
        lastEntry: 'Hoje, 10:15',
        lastExit: 'Hoje, 11:40',
        lastWatched: 'A Herdeira de Ferro IA - Ep. 1'
      }
    ];

    const DEFAULT_COUPONS = [
      { id: 'c1', code: 'VIP7DIAS', type: 'days', value: 7, usesLeft: 20 },
      { id: 'c2', code: 'PROMO490', type: 'price', value: 4.90, usesLeft: 50 }
    ];

    const nowFormatted = () => {
      const d = new Date();
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' +
             d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    };

    const getDaysRemaining = (vipUntil) => {
      if (!vipUntil) return 0;
      const diff = vipUntil - Date.now();
      if (diff <= 0) return 0;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    };

    function App() {
      const [seriesList, setSeriesList] = useState(() => {
        const s = localStorage.getItem('dup_series_v5');
        return s ? JSON.parse(s) : DEFAULT_SERIES;
      });
      const [users, setUsers] = useState(() => {
        const u = localStorage.getItem('dup_users_v5');
        return u ? JSON.parse(u) : DEFAULT_USERS;
      });
      const [coupons, setCoupons] = useState(() => {
        const c = localStorage.getItem('dup_coupons_v5');
        return c ? JSON.parse(c) : DEFAULT_COUPONS;
      });
      const [supportWhatsapp, setSupportWhatsapp] = useState(() => {
        return localStorage.getItem('dup_whatsapp_v5') || '5511999999999';
      });
      const [basePrice, setBasePrice] = useState(() => {
        return Number(localStorage.getItem('dup_price_v5')) || 9.90;
      });

      const [currentUserId, setCurrentUserId] = useState(() => localStorage.getItem('dup_logged_user_v5') || null);
      const [selectedSeriesId, setSelectedSeriesId] = useState('s1');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [activeEpisode, setActiveEpisode] = useState(null);
      const [nextEpisodePrompt, setNextEpisodePrompt] = useState(null);
      const [verticalPlayerMode, setVerticalPlayerMode] = useState(false);

      // Credenciais Nuvem
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem('dup_sb_url') || '');
      const [sbKey, setSbKey] = useState(() => localStorage.getItem('dup_sb_key') || '');
      const [mpToken, setMpToken] = useState(() => localStorage.getItem('dup_mp_token') || '');
      const [cloudConnected, setCloudConnected] = useState(false);
      const [configSavedMsg, setConfigSavedMsg] = useState('');

      // Modais Cliente
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regWhatsapp, setRegWhatsapp] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [userAuthError, setUserAuthError] = useState('');

      // Cupom e Desconto no PIX
      const [showCouponModal, setShowCouponModal] = useState(false);
      const [couponInput, setCouponInput] = useState('');
      const [couponMsg, setCouponMsg] = useState('');
      const [discountedPrice, setDiscountedPrice] = useState(null);

      // Checkout PIX Automático
      const [showVipModal, setShowVipModal] = useState(false);
      const [pixLoading, setPixLoading] = useState(false);
      const [pixPaymentId, setPixPaymentId] = useState(null);
      const [pixQrCode, setPixQrCode] = useState('');
      const [pixQrBase64, setPixQrBase64] = useState('');
      const [pixCopied, setPixCopied] = useState(false);
      const [pixStatusMsg, setPixStatusMsg] = useState('');

      // Segurança ADM
      const [logoClicks, setLogoClicks] = useState(0);
      const [showAdminAuthModal, setShowAdminAuthModal] = useState(false);
      const [adminUnlocked, setAdminUnlocked] = useState(false);
      const [adminTab, setAdminTab] = useState('lancamentos');
      const [adminStoredSecret, setAdminStoredSecret] = useState(() => {
        return localStorage.getItem('dup_adm_sec_v5') || 'YWRtaW4xMjM=';
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Upload Direto & Criação no ADM
      const [uploadingField, setUploadingField] = useState('');
      const [uploadProgressMsg, setUploadProgressMsg] = useState('');

      const [newSerieTitle, setNewSerieTitle] = useState('');
      const [newSerieCategory, setNewSerieCategory] = useState('Mini Novelinha IA');
      const [newSerieSynopsis, setNewSerieSynopsis] = useState('');
      const [newSeriePoster, setNewSeriePoster] = useState('');
      const [newSerieBanner, setNewSerieBanner] = useState('');
      const [newSerieIsHero, setNewSerieIsHero] = useState(false);

      const [newEpSeriesId, setNewEpSeriesId] = useState('s1');
      const [newEpTitle, setNewEpTitle] = useState('');
      const [newEpNumber, setNewEpNumber] = useState(1);
      const [newEpDuration, setNewEpDuration] = useState('03 min');
      const [newEpThumb, setNewEpThumb] = useState('');
      const [newEpVideo, setNewEpVideo] = useState('');
      const [newEpIsVip, setNewEpIsVip] = useState(true);
      const [newEpComingSoon, setNewEpComingSoon] = useState(false);
      const [newEpVertical, setNewEpVertical] = useState(false);

      // Cupons no ADM (Dias Grátis ou Preço Promocional)
      const [newCouponCode, setNewCouponCode] = useState('');
      const [newCouponType, setNewCouponType] = useState('days');
      const [newCouponVal, setNewCouponVal] = useState(7);
      const [newCouponUses, setNewCouponUses] = useState(20);

      const [currentPassCheck, setCurrentPassCheck] = useState('');
      const [newAdminPass, setNewAdminPass] = useState('');
      const [passChangeMsg, setPassChangeMsg] = useState('');

      // ===================================================================
      // SINCRONIZAÇÃO INTELIGENTE COM SUPABASE
      // ===================================================================
      const syncWithSupabase = async (pushData = false, nextS = seriesList, nextU = users, nextC = coupons) => {
        if (!sbUrl.includes('supabase.co') || sbKey.length < 20 || !window.supabase) return;
        try {
          const supabase = window.supabase.createClient(sbUrl.trim(), sbKey.trim());
          if (!pushData) {
            const { data, error } = await supabase.from('app_state').select('*').eq('id', 1).single();
            if (!error && data) {
              setCloudConnected(true);
              if (Array.isArray(data.series_data) && data.series_data.length > 0) setSeriesList(data.series_data);
              if (Array.isArray(data.users_data) && data.users_data.length > 0) setUsers(data.users_data);
              if (Array.isArray(data.coupons_data) && data.coupons_data.length > 0) setCoupons(data.coupons_data);
            }
          } else {
            await supabase.from('app_state').upsert({
              id: 1,
              series_data: nextS,
              users_data: nextU,
              coupons_data: nextC,
              updated_at: new Date().toISOString()
            });
            setCloudConnected(true);
          }
        } catch (e) {}
      };

      useEffect(() => {
        syncWithSupabase(false);
      }, [sbUrl, sbKey]);

      useEffect(() => {
        localStorage.setItem('dup_series_v5', JSON.stringify(seriesList));
        syncWithSupabase(true, seriesList, users, coupons);
      }, [seriesList]);

      useEffect(() => {
        localStorage.setItem('dup_users_v5', JSON.stringify(users));
        syncWithSupabase(true, seriesList, users, coupons);
      }, [users]);

      useEffect(() => {
        localStorage.setItem('dup_coupons_v5', JSON.stringify(coupons));
        syncWithSupabase(true, seriesList, users, coupons);
      }, [coupons]);

      useEffect(() => {
        if (currentUserId) localStorage.setItem('dup_logged_user_v5', currentUserId);
        else localStorage.removeItem('dup_logged_user_v5');
      }, [currentUserId]);

      useEffect(() => {
        const now = Date.now();
        let changed = false;
        const updated = users.map((u) => {
          if (u.isVip && u.vipUntil && u.vipUntil < now) {
            changed = true;
            return { ...u, isVip: false, paymentStatus: 'expired' };
          }
          return u;
        });
        if (changed) setUsers(updated);
      }, []);

      useEffect(() => {
        if (logoClicks === 0) return;
        if (logoClicks >= 3) {
          setShowAdminAuthModal(true);
          setLogoClicks(0);
          return;
        }
        const t = setTimeout(() => setLogoClicks(0), 1200);
        return () => clearTimeout(t);
      }, [logoClicks]);

      const currentUser = users.find((u) => u.id === currentUserId) || null;
      const heroSeries = seriesList.find((s) => s.isHeroLaunch) || seriesList[0];
      const selectedSeries = seriesList.find((s) => s.id === selectedSeriesId) || seriesList[0];

      const allCategories = ['Todas', ...new Set(seriesList.map((s) => s.category))];
      const filteredSeries = seriesList.filter((s) => {
        const matchesCat = selectedCategory === 'Todas' || s.category === selectedCategory;
        const matchesSearch = s.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      // ===================================================================
      // UPLOAD DIRETO DE IMAGENS E VÍDEOS
      // ===================================================================
      const handleDirectFileUpload = async (file, targetField) => {
        if (!file) return;
        setUploadingField(targetField);
        setUploadProgressMsg(`Enviando "${file.name}"... aguarde.`);

        try {
          if (sbUrl.includes('supabase.co') && sbKey.length > 20 && window.supabase) {
            const supabase = window.supabase.createClient(sbUrl.trim(), sbKey.trim());
            const ext = file.name.split('.').pop();
            const fileName = `${targetField}_${Date.now()}.${ext}`;

            const { error } = await supabase.storage
              .from('midia-catalogo')
              .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (error) throw error;

            const { data: publicData } = supabase.storage
              .from('midia-catalogo')
              .getPublicUrl(fileName);

            applyUploadedUrl(targetField, publicData.publicUrl);
            setUploadProgressMsg('✅ Arquivo salvo na nuvem com sucesso!');
          } else {
            if (file.type.startsWith('image/') && file.size < 4 * 1024 * 1024) {
              const reader = new FileReader();
              reader.onloadend = () => {
                applyUploadedUrl(targetField, reader.result);
                setUploadProgressMsg('✅ Imagem carregada com sucesso!');
                setUploadingField('');
              };
              reader.readAsDataURL(file);
              return;
            } else {
              const blobUrl = URL.createObjectURL(file);
              applyUploadedUrl(targetField, blobUrl);
              setUploadProgressMsg('✅ Vídeo carregado! (Lembre-se de conectar o Supabase na Aba 4 para que todos os clientes vejam).');
            }
          }
        } catch (err) {
          setUploadProgressMsg('⚠️ Erro no upload: Certifique-se de que criou o bucket "midia-catalogo" como Public no Supabase.');
        }
        setUploadingField('');
      };

      const applyUploadedUrl = (targetField, url) => {
        if (targetField === 'seriePoster') setNewSeriePoster(url);
        if (targetField === 'serieBanner') setNewSerieBanner(url);
        if (targetField === 'epThumb') setNewEpThumb(url);
        if (targetField === 'epVideo') setNewEpVideo(url);
      };

      // ===================================================================
      // CHECKOUT PIX AUTOMÁTICO
      // ===================================================================
      const openAutomaticPixCheckout = async (customPriceOverride = null) => {
        if (!currentUser) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        const chargeAmount = customPriceOverride || discountedPrice || basePrice;

        setShowVipModal(true);
        setPixStatusMsg('');
        setPixPaymentId(null);
        setPixQrCode('');
        setPixQrBase64('');
        setPixLoading(true);

        try {
          const res = await fetch('/api/criar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: currentUser.email,
              name: currentUser.name,
              userId: currentUser.id,
              mpToken: mpToken.trim(),
              customAmount: chargeAmount
            })
          });

          const data = await res.json();
          if (res.ok && data.paymentId) {
            setPixPaymentId(data.paymentId);
            setPixQrCode(data.qrCode);
            setPixQrBase64(data.qrCodeBase64);
            setPixStatusMsg('🔄 Aguardando pagamento... Assim que pagar no aplicativo do seu banco, o VIP libera sozinho!');
          } else {
            setPixStatusMsg('⚠️ Configure seu Access Token do Mercado Pago na Aba 4 do Painel ADM.');
          }
        } catch (e) {
          setPixStatusMsg('⚠️ Conecte o Token do Mercado Pago no Painel ADM para gerar o QR Code.');
        }
        setPixLoading(false);
      };

      useEffect(() => {
        if (!showVipModal || !pixPaymentId || !currentUser) return;

        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `/api/verificar-pix?paymentId=${pixPaymentId}&mpToken=${encodeURIComponent(mpToken.trim())}`
            );
            const data = await res.json();

            if (data.status === 'approved') {
              const thirtyDaysMs = Date.now() + 30 * 24 * 60 * 60 * 1000;
              setUsers((prev) =>
                prev.map((u) =>
                  u.id === currentUser.id
                    ? { ...u, isVip: true, vipUntil: thirtyDaysMs, paymentStatus: 'approved' }
                    : u
                )
              );
              setPixStatusMsg('✅ PAGAMENTO APROVADO! Seus 30 dias de VIP já estão liberados!');
              clearInterval(interval);
              setTimeout(() => setShowVipModal(false), 2000);
            }
          } catch (err) {}
        }, 4000);

        return () => clearInterval(interval);
      }, [showVipModal, pixPaymentId, currentUser, mpToken]);

      // ===================================================================
      // RESGATE DE CUPOM
      // ===================================================================
      const handleRedeemCoupon = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowCouponModal(false);
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }
        const cleanCode = couponInput.trim().toUpperCase();
        const foundCoupon = coupons.find((c) => c.code === cleanCode && c.usesLeft > 0);

        if (!foundCoupon) {
          setCouponMsg('❌ Cupom inválido ou esgotado.');
          return;
        }

        setCoupons((prev) =>
          prev.map((c) => (c.id === foundCoupon.id ? { ...c, usesLeft: c.usesLeft - 1 } : c))
        );

        if (foundCoupon.type === 'price') {
          setDiscountedPrice(Number(foundCoupon.value));
          setCouponInput('');
          setShowCouponModal(false);
          openAutomaticPixCheckout(Number(foundCoupon.value));
          return;
        }

        const extraMs = Number(foundCoupon.value) * 24 * 60 * 60 * 1000;
        const baseTime = currentUser.isVip && currentUser.vipUntil > Date.now() ? currentUser.vipUntil : Date.now();

        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id
              ? { ...u, isVip: true, vipUntil: baseTime + extraMs, paymentStatus: 'coupon' }
              : u
          )
        );

        setCouponInput('');
        setCouponMsg(`🎉 Cupom ativado! Você ganhou +${foundCoupon.value} dias de VIP!`);
      };

      // ===================================================================
      // CADASTRO, LOGIN E LOGOUT
      // ===================================================================
      const handleUserRegister = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const emailClean = regEmail.trim().toLowerCase();
        if (!regName.trim() || !emailClean || !regPassword.trim()) {
          setUserAuthError('Preencha todos os campos obrigatórios.');
          return;
        }
        if (users.some((u) => u.email.toLowerCase() === emailClean)) {
          setUserAuthError('Este e-mail já está cadastrado. Clique em Entrar.');
          return;
        }

        const newUser = {
          id: 'u_' + Date.now(),
          name: regName.trim(),
          email: emailClean,
          whatsapp: regWhatsapp.trim() || 'Não informado',
          password: regPassword,
          isVip: false,
          vipUntil: null,
          paymentStatus: 'none',
          watchedEpisodeIds: [],
          lastResume: null,
          isOnline: true,
          lastEntry: nowFormatted(),
          lastExit: 'Online agora',
          lastWatched: 'Acabou de criar conta'
        };

        setUsers((prev) => [newUser, ...prev]);
        setCurrentUserId(newUser.id);
        setShowAuthModal(false);
        setRegName('');
        setRegEmail('');
        setRegWhatsapp('');
        setRegPassword('');
      };

      const handleUserLogin = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const emailClean = regEmail.trim().toLowerCase();
        const found = users.find(
          (u) => u.email.toLowerCase() === emailClean && u.password === regPassword
        );

        if (!found) {
          setUserAuthError('E-mail ou senha incorretos.');
          return;
        }

        setUsers((prev) =>
          prev.map((u) =>
            u.id === found.id
              ? { ...u, isOnline: true, lastEntry: nowFormatted(), lastExit: 'Online agora' }
              : u
          )
        );
        setCurrentUserId(found.id);
        setShowAuthModal(false);
        setRegEmail('');
        setRegPassword('');
      };

      const handleUserLogout = () => {
        if (!currentUser) return;
        setUsers((prev) =>
          prev.map((u) =>
            u.id === currentUser.id ? { ...u, isOnline: false, lastExit: nowFormatted() } : u
          )
        );
        setCurrentUserId(null);
        setActiveEpisode(null);
      };

      const handlePlayEpisode = (episode, serieObj = selectedSeries) => {
        if (episode.comingSoon) {
          alert('🔥 Este episódio estreia em breve! Fique ligado.');
          return;
        }
        if (!currentUser) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        const hasValidVip = currentUser.isVip && (!currentUser.vipUntil || currentUser.vipUntil > Date.now());
        if (episode.isVip && !hasValidVip) {
          openAutomaticPixCheckout();
          return;
        }

        setVerticalPlayerMode(Boolean(episode.isVertical));
        setNextEpisodePrompt(null);
        setActiveEpisode(episode);

        setUsers((prev) =>
          prev.map((u) => {
            if (u.id !== currentUser.id) return u;
            const prevWatched = Array.isArray(u.watchedEpisodeIds) ? u.watchedEpisodeIds : [];
            const nextWatched = prevWatched.includes(episode.id) ? prevWatched : [...prevWatched, episode.id];
            return {
              ...u,
              watchedEpisodeIds: nextWatched,
              lastResume: {
                serieId: serieObj.id,
                epId: episode.id,
                title: `${serieObj.title} • Ep. ${episode.number}`
              },
              lastWatched: `${serieObj.title} - Ep. ${episode.number}`
            };
          })
        );
      };

      const handleVideoEnded = () => {

                      target="_blank"
                      rel="noreferrer"
                      className="block text-center text-xs text-gray-400 hover:text-[#00d4ff] pt-1"
                    >
                      Esqueceu a senha? Recuperar via WhatsApp
                    </a>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODAL SECRETO DO ADM */}
          {showAdminAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (btoa(passwordInput) === adminStoredSecret) {
                    setAdminUnlocked(true);
                    setShowAdminAuthModal(false);
                    setPasswordInput('');
                    setAuthError('');
                  } else {
                    setAuthError('Senha incorreta.');
                  }
                }}
                className="bg-[#0d1017] border border-white/15 rounded-2xl max-w-sm w-full p-6 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black uppercase">🔒 Painel do Administrador</h3>
                  <button type="button" onClick={() => setShowAdminAuthModal(false)}>✕</button>
                </div>
                <input
                  type="password"
                  required
                  autoFocus
                  value={passwordInput}
                  onChange={(e) => setPasswordInput(e.target.value)}
                  placeholder="Senha do Administrador"
                  className="w-full px-4 py-3 rounded-xl bg-[#07080c] border border-white/15 text-sm text-white"
                />
                {authError && <p className="text-xs text-[#ff1722]">{authError}</p>}
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-[#ff1722] text-white font-black text-xs uppercase"
                >
                  Desbloquear
                </button>
              </form>
            </div>
          )}

          <footer className="border-t border-white/10 py-8 px-6 text-center text-xs text-gray-500 space-y-2">
            <div className="flex flex-wrap items-center justify-center gap-4">
              <span>© 2026 Da Um Play IA — Obras originais produzidas com Inteligência Artificial.</span>
              <a
                href={`https://wa.me/${supportWhatsapp}?text=Ol%C3%A1%2C%20preciso%20de%20suporte%20no%20Da%20Um%20Play%20IA`}
                target="_blank"
                rel="noreferrer"
                className="text-[#00d4ff] hover:underline font-semibold"
              >
                💬 Suporte via WhatsApp
              </a>
              <button onClick={() => setShowAdminAuthModal(true)} className="opacity-20 hover:opacity-60 p-1">
                🔒
              </button>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
