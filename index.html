        supportWhatsapp: supportWhatsapp.trim(),
        basePrice: Number(basePrice) || 9.90,
        adminStoredSecret

      const pullFromSupabase = async () => {
        const validUrl = cleanSupabaseUrl(sbUrl);
        if (!validUrl.includes('supabase.co') || sbKey.length < 15 || !window.supabase) {
          isHydratedRef.current = true;
          return;
        }
        try {
          const supabase = window.supabase.createClient(validUrl, sbKey.trim());
          const { data, error } = await supabase.from('app_state').select('*').eq('id', 1).single();
          if (!error && data) {
            setCloudConnected(true);
            if (Array.isArray(data.series_data) && data.series_data.length > 0) {
              setSeriesList(data.series_data);
            }
            if (Array.isArray(data.users_data) && data.users_data.length > 0) {
              setUsers(data.users_data);
            }
            if (Array.isArray(data.coupons_data) && data.coupons_data.length > 0) {
              const realCoupons = data.coupons_data.filter((c) => c.id !== '__SYS_CONFIG__');
              const embeddedConfig = data.coupons_data.find((c) => c.id === '__SYS_CONFIG__');
              if (realCoupons.length > 0) setCoupons(realCoupons);
              if (embeddedConfig) {
                if (embeddedConfig.mpToken && embeddedConfig.mpToken.length > 10) setMpToken(embeddedConfig.mpToken);
                if (embeddedConfig.supportWhatsapp) setSupportWhatsapp(embeddedConfig.supportWhatsapp);
                if (embeddedConfig.basePrice) setBasePrice(Number(embeddedConfig.basePrice));
                if (embeddedConfig.adminStoredSecret) setAdminStoredSecret(embeddedConfig.adminStoredSecret);
              }
            }
            if (data.settings_data && typeof data.settings_data === 'object') {
              if (data.settings_data.mpToken && data.settings_data.mpToken.length > 10) {
                setMpToken(data.settings_data.mpToken);
              }
              if (data.settings_data.supportWhatsapp) setSupportWhatsapp(data.settings_data.supportWhatsapp);
              if (data.settings_data.basePrice) setBasePrice(Number(data.settings_data.basePrice));
              if (data.settings_data.adminStoredSecret) setAdminStoredSecret(data.settings_data.adminStoredSecret);
            }
          }
        } catch (e) {}
        isHydratedRef.current = true;
      };

        nextU = users,
        nextC = coupons,
        nextSettings = buildSettingsPayload()
      ) => {
        if (!isHydratedRef.current) return;
        const validUrl = cleanSupabaseUrl(sbUrl);
        if (!validUrl.includes('supabase.co') || sbKey.length < 15 || !window.supabase) return;
        try {
          const supabase = window.supabase.createClient(validUrl, sbKey.trim());

            ...cleanCoupons,
            { id: '__SYS_CONFIG__', code: '__SYS_CONFIG__', usesLeft: 0, ...nextSettings }

          const { error } = await supabase.from('app_state').upsert({
            id: 1,
            series_data: nextS,
            users_data: nextU,
            coupons_data: couponsWithBackupConfig,
            settings_data: nextSettings,
            updated_at: new Date().toISOString()

          if (!error) {
            setCloudConnected(true);
          } else {
            const { error: fallbackErr } = await supabase.from('app_state').upsert({

              series_data: nextS,
              users_data: nextU,
              coupons_data: couponsWithBackupConfig,
              updated_at: new Date().toISOString()

            if (!fallbackErr) setCloudConnected(true);

        try {
          const validUrl = cleanSupabaseUrl(sbUrl);
          if (validUrl.includes('supabase.co') && sbKey.length > 15 && window.supabase) {
            const supabase = window.supabase.createClient(validUrl, sbKey.trim());
            const ext = file.name.split('.').pop();
            const fileName = `${targetField}_${Date.now()}.${ext}`;

            const { error } = await supabase.storage
              .from('midia-catalogo')
              .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (error) throw error;

            const { data: publicData } = supabase.storage
              .from('midia-catalogo')
              .getPublicUrl(fileName);

            applyUploadedUrl(targetField, publicData.publicUrl);
            setUploadProgressMsg('✅ Mídia publicada na nuvem com sucesso!');
          } else {
            const blobUrl = URL.createObjectURL(file);
            applyUploadedUrl(targetField, blobUrl);
            setUploadProgressMsg('✅ Mídia pronta!');
          }
        } catch (err) {
          setUploadProgressMsg('⚠️ Erro ao enviar arquivo. Verifique o bucket midia-catalogo no Supabase.');
        }
        setUploadingField('');
      };

      const applyUploadedUrl = (targetField, url) => {
        if (targetField === 'seriePoster') setNewSeriePoster(url);
        if (targetField === 'serieBanner') setNewSerieBanner(url);
        if (targetField === 'epThumb') setNewEpThumb(url);

      // ===================================================================
      // CHECKOUT PIX 100% AUTOMÁTICO (COM PROTEÇÃO ANTI-AUTO-PAGAMENTO)
      // ===================================================================
      const openAutomaticPixCheckout = async (customPriceOverride = null, allowAdminPreview = false) => {
        if (!currentUser && !allowAdminPreview) {
          setAuthMode('register');
          setShowAuthModal(true);
          return;
        }

        const chargeAmount = Number(customPriceOverride || discountedPrice || basePrice || 9.90);
        const activeToken = (mpToken || FIXED_MP_TOKEN || '').trim();

        setShowVipModal(true);
        setPixStatusMsg('');
        setPixErrorDetail('');
        setPixPaymentId(null);
        setPixQrCode('');
        setPixQrBase64('');
        setPixLoading(true);

        // E-mail técnico seguro para que o Mercado Pago NUNCA bloqueie quando você testar com seu próprio e-mail
        const safePayerEmail = `assinante.${Date.now()}@daumplayia.com`;
        const payerName = currentUser?.name || 'Assinante VIP';
        const payerId = currentUser?.id || 'admin_test';

        try {
          const res = await fetch('/api/criar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: safePayerEmail,
              name: payerName,
              userId: payerId,
              mpToken: activeToken,
              customAmount: chargeAmount
            })
          });

          const data = await res.json();
          if (res.ok && data.paymentId) {
            setPixPaymentId(data.paymentId);
            setPixQrCode(data.qrCode);
            setPixQrBase64(data.qrCodeBase64);
            setPixStatusMsg('⚡ Escaneie o QR Code ou copie o código abaixo. Seu VIP libera em 3 segundos após pagar!');
          } else {
            if (!activeToken) {
              setPixErrorDetail('O Access Token (APP_USR-...) ainda não foi salvo na Aba 4 do Painel ADM.');
            } else {
              setPixErrorDetail(data.error || 'Verifique se o seu Access Token APP_USR-... está ativo no Mercado Pago.');
            }
          }
        } catch (e) {
          setPixErrorDetail('Erro de comunicação com a rota /api/criar-pix.');
        }
        setPixLoading(false);
      };

      // Verificação automática a cada 3 segundos para liberar o VIP sozinho
      useEffect(() => {
        if (!showVipModal || !pixPaymentId) return;
        const activeToken = (mpToken || FIXED_MP_TOKEN || '').trim();

        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `/api/verificar-pix?paymentId=${pixPaymentId}&mpToken=${encodeURIComponent(activeToken)}`
            );
            const data = await res.json();

            if (data.status === 'approved') {
              const thirtyDaysMs = Date.now() + 30 * 24 * 60 * 60 * 1000;
              if (currentUser) {
                setUsers((prev) =>
                  prev.map((u) =>
                    u.id === currentUser.id
                      ? { ...u, isVip: true, vipUntil: thirtyDaysMs, paymentStatus: 'approved' }
                      : u
                  )
                );
              }
              setPixStatusMsg('✅ PAGAMENTO CONFIRMADO! Seus 30 dias de Acesso VIP já estão liberados!');
              clearInterval(interval);
              setTimeout(() => setShowVipModal(false), 2200);
            }

        return () => clearInterval(interval);

        setCoupons((prev) =>

        const extraMs = Number(foundCoupon.value) * 24 * 60 * 60 * 1000;

        setUsers((prev) =>

                  ✕
                </button>

                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 text-[10px] font-black uppercase">
                  🔒 Checkout PIX Automático • Mercado Pago
                </div>

                <h3 className="text-xl font-black">Acesso VIP Completo — 30 Dias</h3>
                <div className="text-3xl font-black text-[#00d4ff]">R$ {activePriceDisplay}</div>

                {pixLoading && (
                  <div className="py-8 space-y-3">
                    <div className="w-10 h-10 border-4 border-[#00d4ff] border-t-transparent rounded-full animate-spin mx-auto" />
                    <p className="text-xs text-[#00d4ff] font-bold">Gerando seu QR Code PIX exclusivo...</p>
                  </div>
                )}

                {pixQrBase64 && (
                  <div className="space-y-3">
                    <div className="bg-white p-3 rounded-2xl w-52 h-52 mx-auto shadow-xl flex items-center justify-center">
                      <img
                        src={`data:image/png;base64,${pixQrBase64}`}
                        alt="QR Code PIX Oficial"
                        className="w-full h-full object-contain"
                      />
                    </div>
                    <p className="text-[11px] text-gray-300">
                      Abra o app do seu banco e escaneie o QR Code acima ou copie o código abaixo:
                    </p>
                  </div>
                )}

                {pixQrCode && (
                  <div className="space-y-2">
                    <input
                      type="text"
                      readOnly
                      value={pixQrCode}
                      className="w-full px-3 py-2 rounded-xl bg-[#05060a] border border-white/15 text-[10px] text-gray-400 font-mono text-center"
                    />
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(pixQrCode);
                        setPixCopied(true);
                        setTimeout(() => setPixCopied(false), 3000);
                      }}
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#00d4ff] to-[#00a3cc] text-[#05060a] text-xs font-black uppercase shadow-lg"
                    >
                      {pixCopied ? '✅ CÓDIGO PIX COPIADO!' : `📋 COPIAR CÓDIGO PIX (COPIA E COLA)`}
                    </button>
                  </div>
                )}

                {pixStatusMsg && (
                  <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-300 font-bold">
                    {pixStatusMsg}
                  </div>
                )}

                {pixErrorDetail && (
                  <div className="p-3.5 rounded-xl bg-red-500/15 border border-red-500/40 text-xs text-red-300 font-bold space-y-2">
                    <p>⚠️ {pixErrorDetail}</p>
                    <button
                      onClick={() => openAutomaticPixCheckout(null, true)}
                      className="px-4 py-2 rounded-lg bg-[#00d4ff] text-[#05060a] font-black text-[11px] uppercase"
                    >
                      🔄 Tentar Gerar QR Code Novamente
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL DE LOGIN E CADASTRO */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border border-white/15 rounded-3xl max-w-md w-full p-6 space-y-4 relative">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="flex gap-2 bg-[#05060a] p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('login');
                      setUserAuthError('');
                    }}
                    className={`flex-1 py-2 rounded-lg text-xs font-black uppercase ${
                      authMode === 'login' ? 'bg-[#ff1722] text-white' : 'text-gray-400'
                    }`}
                  >
                    Entrar
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('register');
                      setUserAuthError('');
                    }}
                    className={`flex-1 py-2 rounded-lg text-xs font-black uppercase ${
                      authMode === 'register' ? 'bg-[#00d4ff] text-[#05060a]' : 'text-gray-400'
                    }`}
                  >
                    Criar Conta
                  </button>
                </div>

                {authMode === 'register' ? (
                  <form onSubmit={handleUserRegister} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Seu Nome Completo"
                      value={regName}
                      onChange={(e) => setRegName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="email"
                      required
                      placeholder="Seu Melhor E-mail"
                      value={regEmail}
                      onChange={(e) => setRegEmail(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="tel"
                      placeholder="Seu WhatsApp com DDD"
                      value={regWhatsapp}
                      onChange={(e) => setRegWhatsapp(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="password"
                      required
                      placeholder="Crie uma Senha"
                      value={regPassword}
                      onChange={(e) => setRegPassword(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    {userAuthError && <p className="text-xs text-[#ff1722] font-bold">{userAuthError}</p>}
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-[#00d4ff] text-[#05060a] font-black text-xs uppercase"
                    >
                      Criar Minha Conta Grátis
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleUserLogin} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Seu E-mail de Acesso"
                      value={regEmail}
                      onChange={(e) => setRegEmail(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    <input
                      type="password"
                      required
                      placeholder="Sua Senha"
                      value={regPassword}
                      onChange={(e) => setRegPassword(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-[#05060a] border border-white/15 text-xs text-white"
                    />
                    {userAuthError && <p className="text-xs text-[#ff1722] font-bold">{userAuthError}</p>}
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-[#ff1722] text-white font-black text-xs uppercase"
                    >
                      Entrar na Plataforma
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODAL DE TERMOS E PRIVACIDADE */}
          {legalModalText && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#0d1017] border border-white/15 rounded-3xl max-w-lg w-full p-6 space-y-4 relative">
                <button
                  onClick={() => setLegalModalText(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <h3 className="text-base font-black text-[#00d4ff]">{legalModalText.title}</h3>
                <p className="text-xs text-gray-300 leading-relaxed">{legalModalText.body}</p>
                <button
                  onClick={() => setLegalModalText(null)}
                  className="w-full py-2.5 rounded-xl bg-white/10 text-xs font-bold"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          {/* RODAPÉ PROFISSIONAL DE STREAMING */}
          <footer className="bg-[#080a10] border-t border-white/10 pt-10 pb-8 px-6 text-xs text-gray-400">
            <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 pb-8 border-b border-white/10">
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <span className="text-base font-black tracking-tighter text-white">
                    DA UM <span className="text-[#ff1722]">PLAY</span> <span className="text-[#00d4ff]">IA</span>
                  </span>
                </div>
                <p className="text-xs text-gray-500 leading-relaxed">
                  Plataforma digital de séries curtas, mini novelinhas e produções originais criadas com Inteligência Artificial.
                </p>
              </div>

              <div className="space-y-2">
                <h4 className="text-white font-bold uppercase text-[11px] tracking-wider">Segurança & Pagamento</h4>
                <ul className="space-y-1.5 text-gray-400">
                  <li>🔒 Checkout Transparente PIX Banco Central</li>
                  <li>⚡ Liberação Automática em 3 segundos</li>
                  <li>📱 Compatível com Android, iPhone, PC e TV</li>
                </ul>
              </div>

              <div className="space-y-3">
                <h4 className="text-white font-bold uppercase text-[11px] tracking-wider">Central do Assinante</h4>
                <p className="text-xs text-gray-500">Atendimento rápido para assinantes:</p>
                <a
                  href={`https://wa.me/${supportWhatsapp}?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20na%20plataforma%20Da%20Um%20Play%20IA`}
                  target="_blank"
                  rel="noreferrer"
                  className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 font-bold text-xs hover:bg-emerald-500/25 transition"
                >
                  💬 Suporte Oficial
                </a>
              </div>
            </div>

            <div className="max-w-6xl mx-auto pt-6 flex flex-wrap items-center justify-between gap-4 text-[11px] text-gray-500">
              <span>© 2026 Da Um Play IA. Todos os direitos reservados.</span>
              <div className="flex gap-4">
                <button
                  onClick={() =>
                    setLegalModalText({
                      title: 'Termos de Uso',
                      body: 'O acesso VIP concede direito de visualização pessoal por 30 dias corridos na plataforma Da Um Play IA. É estritamente proibido gravar, copiar ou redistribuir os vídeos protegidos por direitos autorais.'
                    })
                  }
                  className="hover:text-gray-300"
                >
                  Termos de Uso
                </button>
                <button
                  onClick={() =>
                    setLegalModalText({
                      title: 'Política de Privacidade',
                      body: 'Seus dados de acesso (nome, e-mail e telefone) são protegidos e utilizados exclusivamente para liberação automática da sua assinatura VIP.'
                    })
                  }
                  className="hover:text-gray-300"
                >
                  Privacidade
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
